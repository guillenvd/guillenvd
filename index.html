 casa:'https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=1100&q=83',
 miga:'https://images.unsplash.com/photo-1555507036-ab1f4038808a?auto=format&fit=crop&w=1100&q=83',
 taller:'https://images.unsplash.com/photo-1442512595331-e89e73853f31?auto=format&fit=crop&w=1100&q=83',
 bruma1:'https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1100&q=83',
 bruma2:'https://images.unsplash.com/photo-1511920170033-f8396924c348?auto=format&fit=crop&w=1100&q=83'
};

const eventPhoto='https://images.unsplash.com/photo-1445116572660-236099ec97a0?auto=format&fit=crop&w=850&q=82';

// Locations are demo-supplied, never fabricated; edit rights depend on demo space.
const locationOf=id=>s.locationData?.[id]||{address:'',googlePlaceId:''};
const hasAddress=id=>(locationOf(id).address||'').trim().length>=8;
const googleId=id=>(locationOf(id).googlePlaceId||'').trim();
const mapTerm=id=>hasAddress(id)?locationOf(id).address.trim():'';
const googlePlaceURL=id=>{if(!hasAddress(id))return '';const q=new URLSearchParams({api:'1',query:mapTerm(id)});if(googleId(id))q.set('query_place_id',googleId(id));return 'https://www.google.com/maps/search/?'+q.toString()};
const applePlaceURL=id=>hasAddress(id)?'https://maps.apple.com/place?'+new URLSearchParams({address:mapTerm(id)}).toString():'';
function mapRouteURL(provider){const ids=s.route;if(!ids.length||ids.some(id=>!hasAddress(id)))return '';const stops=ids.map(mapTerm);if(provider==='google'){
 const q=new URLSearchParams({api:'1',destination:stops.at(-1),travelmode:s.mapTravelMode||'driving'});
 if(stops.length>=2)q.set('origin',stops[0]);
 if(stops.length>2)q.set('waypoints',stops.slice(1,-1).join('|'));
 return 'https://www.google.com/maps/dir/?'+q.toString();
}
 const q=new URLSearchParams({destination:stops.at(-1),mode:s.mapTravelMode||'driving'});
 if(stops.length>=2)q.set('source',stops[0]);
 stops.slice(1,-1).forEach(p=>q.append('waypoint',p));
 return 'https://maps.apple.com/directions?'+q.toString();
}
const googleShortlistURL=()=>{const ids=s.route.map(googleId);if(!ids.length||ids.some(id=>!id))return '';return 'https://www.google.com/maps/@?'+new URLSearchParams({api:'1',map_action:'shortlist',place_ids:ids.join(',')}).toString()};
function openVerifiedURL(url){if(!url||!/^https:\/\/(?:www\.google\.com\/maps\/|maps\.apple\.com\/)/.test(url))return notice('Completa las direcciones requeridas antes de abrir el mapa');const tab=window.open(url,'_blank','noopener,noreferrer');if(!tab)window.location.href=url;}
function locationActions(id){return hasAddress(id)?`<div class="inline-actions">${btn('↗ Google Maps','mapPlace:google:'+id,'ghost small')}${btn('↗ Apple Maps','mapPlace:apple:'+id,'ghost small')}</div>`:`<p class="slim muted">Dirección pendiente de registrar · no se mostrarán ubicaciones inventadas.</p>`}
function adminCanEditLocation(id){return s.space==='admin'||(s.space==='business'&&['bruma1','bruma2'].includes(id))}
function locationEditorStart(id){if(!place(id)||!adminCanEditLocation(id))return notice('Sin permiso de edición para esta ficha');s.form={placeId:id,address:locationOf(id).address||'',googlePlaceId:googleId(id)};s.modal='locationEditor';render()}
function locationEditor(){const f=s.form||{},p=place(f.placeId);return `<div class="stack"><p class="lead">${esc(p?.branch||'Sucursal')}</p>${field('address','Dirección completa (calle, número, ciudad, estado, país)','text',f.address||'',false,'maxlength="240" placeholder="Calle, número, colonia, ciudad, país"')}${field('googlePlaceId','Google Place ID (opcional, para crear listas)','text',f.googlePlaceId||'',false,'maxlength="250" placeholder="ChIJ..."')}<div class="banner">La ubicación se guarda solo en este navegador. Revisa que corresponda a la sede real; Rondaza no geocodifica ni verifica direcciones en esta demo. El ID es opcional para abrir mapas, pero necesario para exportar una lista Google.</div><div class="inline-actions">${btn('Guardar dirección','saveLocation','primary')}${btn('Cancelar','close','secondary')}</div></div>`}
function locationList(ids){return `<div class="grid two">${ids.map(id=>{const p=place(id),l=locationOf(id);return `<article class="card"><div class="row"><h3>${esc(p.branch)}</h3>${t(hasAddress(id)?'Dirección añadida':'Sin dirección',hasAddress(id)?'neutral':'amber')}</div><p class="slim">${esc(l.address||'Añade una dirección completa para activar navegación.')}</p>${l.googlePlaceId?`<p class="slim muted">Google Place ID configurado</p>`:''}<div class="inline-actions">${btn('Editar dirección','editLocation:'+id,'secondary small')}${hasAddress(id)?btn('Ver en Google Maps','mapPlace:google:'+id,'ghost small'):''}</div></article>`}).join('')}</div>`}
function routeExportSection(){const missing=s.route.filter(id=>!hasAddress(id)),missingIDs=s.route.filter(id=>!googleId(id));return `<section class="card map-export"><div class="row"><div><div class="eyebrow">ABRIR EN MAPAS</div><h3>Tu plan, listo para navegar.</h3></div>${t((s.route.length||0)+' paradas','neutral')}</div><p>Rondaza organiza el plan. Abre una ruta de Google o Apple Maps con las paradas en el orden elegido.</p><div class="map-mode-picker"><label for="map-mode">Cómo viajar</label><select id="map-mode" class="selector" data-change="mapTravelMode"><option value="driving" ${s.mapTravelMode==='driving'?'selected':''}>En coche</option><option value="walking" ${s.mapTravelMode==='walking'?'selected':''}>Caminando</option></select></div><div class="export-buttons">${btn('↗ Ruta en Google Maps','exportRoute:google','primary',!s.route.length||missing.length?'disabled':'')}${btn('↗ Ruta en Apple Maps','exportRoute:apple','secondary',!s.route.length||missing.length?'disabled':'')}${btn('↗ Lista en Google Maps','exportGoogleList','secondary',!s.route.length||missingIDs.length?'disabled':'')}${btn('Copiar lugares','copyPlaces','ghost',!s.route.length?'disabled':'')}</div>${missing.length?`<div class="banner">Faltan direcciones: ${esc(missing.map(id=>place(id).branch).join(', '))}. ${s.space==='personal'?'Un negocio o el equipo editorial puede completarlas en el catálogo.':'Agrégalas desde Sucursales / Catálogo.'}</div>`:''}${missingIDs.length?`<p class="slim muted">Para la lista Google falta un Place ID de: ${esc(missingIDs.map(id=>place(id).branch).join(', '))}. La ruta normal no necesita estos IDs.</p>`:''}<p class="slim muted">No se crea una lista guardada automáticamente en tu cuenta. Google muestra una selección que puedes guardar allí. Apple Maps abre una ruta, no una Guía guardada.</p></section>`}


const sharedClub=()=>s.loyaltyMode==='shared';
const effectiveProgram=id=>sharedClub()&&branches.includes(id)?s.sharedProgram:s.clubPrograms[id];
const activeStampProgram=id=>sharedClub()?`${CLUB_SHARED_ID}-v${s.sharedEpoch}`:id;
const joinedClub=id=>sharedClub()?!!s.sharedJoined:s.joined.includes(id);
const stampCount=id=>sharedClub()?Number(s.sharedStamps||0):Number(s.stamps[id]||0);
const visitKey=id=>sharedClub()?`shared-${id}`:id;
const clubLocationText=()=>sharedClub()?'Válida en Hipódromo y Zona Río':'Exclusiva de la sucursal';
const menuCatalog=id=>s.menuMode==='brand'?s.brandMenu:(s.branchMenus[id]||[]);
const menuAvailable=(item,id)=>item.status==='published'&&(s.menuMode==='brand'?item.locations?.includes(id):true);
const menuAt=id=>menuCatalog(id).filter(item=>menuAvailable(item,id));
const menuMoney=item=>`${item.currency==='USD'?'US$':'MX$'}${Number(item.price||0).toLocaleString('es-MX',{minimumFractionDigits:0,maximumFractionDigits:2})}`;
const menuExtra=item=>[item.origin?`Origen: ${item.origin}`:'',item.varietal?`Variedad: ${item.varietal}`:'',item.process?`Proceso: ${item.process}`:'',item.roast?`Tueste: ${item.roast}`:'',item.notes?`Notas: ${item.notes}`:'',item.beanName?`Grano: ${item.beanName}`:''].filter(Boolean).join(' · ');
const itemMethods=item=>(Array.isArray(item.methods)?item.methods:[]).filter(Boolean);
function menuItemHTML(item,{manage=false,scope=null}={}){
 const cat=MENU_CATEGORIES[item.category]||MENU_CATEGORIES.otro;
 return `<article class="menu-entry"><span class="menu-emoji">${cat[0]}</span><div class="menu-entry-main"><div class="menu-entry-heading"><b>${esc(item.name)}</b><strong class="menu-price">${esc(menuMoney(item))}</strong></div><div class="meta">${esc(cat[1])}${item.status==='draft'?' · Borrador':''}</div><p>${esc(item.description||'')}</p>${menuExtra(item)?`<div class="menu-details">${esc(menuExtra(item))}</div>`:''}${itemMethods(item).length?`<div class="menu-methods">${itemMethods(item).map(x=>t(x,'neutral')).join('')}</div>`:''}${manage?`<div class="menu-entry-actions">${btn('Editar','editMenu:'+item.id,'secondary small')}${btn('Eliminar','deleteMenu:'+item.id,'ghost small')}${s.menuMode==='brand'?`<div class="menu-availability">${branches.map(id=>`<label class="switch-row"><input type="checkbox" data-menu-location="${esc(item.id)}" data-branch="${id}" ${item.locations?.includes(id)?'checked':''}/> ${esc(place(id).area)}</label>`).join('')}</div>`:''}</div>`:''}</div></article>`;
}
function branchMenuPreview(id){const visible=menuAt(id);return `<div class="card menu-preview-branch"><div class="row"><h3>${esc(place(id).area)}</h3>${t(`${visible.length} productos`,'neutral')}</div><div class="menu-methods">${[...new Set(visible.flatMap(itemMethods))].slice(0,6).map(m=>t(m)).join('')}</div><div class="stack" style="gap:4px">${visible.slice(0,3).map(x=>`<div class="menu-mini-row"><span>${esc(x.name)}</span><b>${esc(menuMoney(x))}</b></div>`).join('')}</div><div class="inline-actions" style="margin-top:17px">${btn('Ver menú de esta sede','menuBranch:'+id,'secondary full')}</div></div>`}
function menuTabs(){return `<div class="toolbar menu-filter">${[['all','Todos'],['bebida','Bebidas'],['granos','Granos'],['pan','Panadería'],['otro','Otros']].map(([v,l])=>`<button class="tab ${s.menuCategory===v?'active':''}" data-action="menuFilter:${v}">${l}</button>`).join('')}</div>`}
function pageMenuBusiness(){
 const shared=s.menuMode==='brand',id=s.scope==='all'?'bruma1':s.scope,items=menuCatalog(id).filter(x=>s.menuCategory==='all'||x.category===s.menuCategory);
 const intro=`${head('BRUMA CAFÉ · CATÁLOGO','Menú y café.','Gestiona bebidas, panadería, granos, métodos de extracción y disponibilidad por ubicación.',btn('+ Añadir producto','newMenu','primary',!shared&&s.scope==='all'?'disabled':''))}<section class="card catalog-mode"><div><div class="eyebrow">ESTRUCTURA DEL MENÚ</div><h3>¿Un menú para toda la marca o distinto por sede?</h3><p>El catálogo de marca se comparte; puedes desactivar productos que una sede no ofrece. Los menús por sede se editan independientemente.</p></div><div class="mode-buttons"><button class="mode-card ${shared?'selected':''}" data-action="menuMode:brand" aria-pressed="${shared}"><span class="mode-emoji">◎</span><b>Menú general</b><small>Un catálogo · disponibilidad por sede</small></button><button class="mode-card ${!shared?'selected':''}" data-action="menuMode:branch" aria-pressed="${!shared}"><span class="mode-emoji">▦</span><b>Menú por sucursal</b><small>Productos y precios propios</small></button></div></section>`;
 if(!shared&&s.scope==='all')return `${intro}<div class="banner" style="margin-bottom:18px">Selecciona una sucursal para editar sus productos. Los menús de Hipódromo y Zona Río se guardan por separado.</div><div class="grid two">${branches.map(branchMenuPreview).join('')}</div>`;
 return `${intro}${shared?`<div class="banner" style="margin-bottom:18px">Los cambios de nombre, precio y descripción afectan a ambas sucursales. La disponibilidad se decide individualmente con las casillas debajo de cada producto.</div>`:`<div class="banner" style="margin-bottom:18px">Editando exclusivamente ${esc(place(id).branch)}. Los cambios no afectan a otras sucursales.</div>`}${menuTabs()}<div class="row" style="margin:0 0 16px"><h3>Catálogo ${shared?'de marca':'· '+esc(place(id).area)}</h3>${t(`${items.length} productos`,'neutral')}</div><div class="menu-panel">${items.map(x=>menuItemHTML(x,{manage:true,scope:id})).join('')||'<div class="empty">No hay productos en esta categoría.</div>'}</div><div class="section-head"><h2>Vista del cliente por sede</h2></div><div class="grid two">${(shared?branches:[id]).map(branchMenuPreview).join('')}</div>`
}
function menuPublicHTML(id){const menu=menuAt(id);if(!menu.length)return '<p>No hay productos publicados en esta sede.</p>';const grouped=['bebida','granos','pan','otro'];return `<div class="menu-methods" style="margin-bottom:12px">${[...new Set(menu.flatMap(itemMethods))].map(x=>t(x,'neutral')).join('')}</div>${grouped.map(k=>{const rows=menu.filter(x=>x.category===k);return rows.length?`<div class="menu-public-section"><h3>${MENU_CATEGORIES[k][0]} ${MENU_CATEGORIES[k][1]}</h3>${rows.map(x=>menuItemHTML(x)).join('')}</div>`:''}).join('')}<p class="slim muted">Menú ficticio para prototipo. Disponibilidad y precios ilustrativos, confirmarlos con la cafetería.</p>`}
function startMenuEditor(itemId){const id=s.scope==='all'?'bruma1':s.scope;if(s.menuMode==='branch'&&s.scope==='all')return notice('Selecciona la sede para editar su menú');const existing=menuCatalog(id).find(x=>x.id===itemId);s.form=existing?{...existing,methods:(existing.methods||[]).join(', '),locations:[...(existing.locations||[])]}:{name:'',category:'bebida',description:'',price:'',currency:'MXN',status:'published',methods:'Espresso',beanName:'',origin:'',varietal:'',process:'',roast:'',notes:'',locations:sharedMenuLocations()};s.modal='menuEditor';render()}
function sharedMenuLocations(){return s.scope==='all'?branches.slice():[s.scope]}
function menuEditorBody(){const f=s.form||{};return `<div class="stack"><div class="banner">${s.menuMode==='brand'?'Editas el menú de marca. La disponibilidad por sede se ajusta después desde el catálogo.':'Editas únicamente '+esc(place(s.scope)?.branch||'la sucursal seleccionada')}. Datos locales de ejemplo.</div><div class="form-grid">${field('name','Nombre del producto','text',f.name||'',true,'maxlength="65"')}${selectField('category','Categoría',Object.entries(MENU_CATEGORIES).map(([key,values])=>[key,values[1]]),f.category||'bebida')}${field('price','Precio','number',f.price||'',true,'min="0" step="0.01"')}${selectField('currency','Moneda',[['MXN','MXN'],['USD','USD']],f.currency||'MXN')}<div class="span2">${textField('description','Descripción del producto',f.description||'',false)}</div><div class="span2">${field('methods','Métodos disponibles (separados por coma)','text',f.methods||'',false,'placeholder="Espresso, V60, Aeropress"')}</div><div class="span2">${field('beanName','Grano utilizado (para bebidas)','text',f.beanName||'',false,'placeholder="Blend de la casa"')}</div>${field('origin','Origen del café','text',f.origin||'',false,'placeholder="Chiapas, México"')}${field('varietal','Varietal','text',f.varietal||'',false,'placeholder="Bourbon"')}${field('process','Proceso','text',f.process||'',false,'placeholder="Lavado / Natural"')}${selectField('roast','Tueste',[['','No especificado'],['Claro','Claro'],['Medio','Medio'],['Oscuro','Oscuro']],f.roast||'')}<div class="span2">${field('notes','Notas de sabor','text',f.notes||'',false,'placeholder="Cacao, panela, cítricos"')}</div>${selectField('status','Visibilidad',[['published','Publicado'],['draft','Borrador']],f.status||'published')}</div><div class="modal-footer">${btn('Cancelar','close','secondary')}${btn('Guardar producto','saveMenu','primary')}</div></div>`}

function notice(str){s.toast=str;render();setTimeout(()=>{if(s.toast===str){s.toast='';const el=document.getElementById('toast');if(el)el.remove()}},3800)}
function nav(page){s.page=page;s.modal=null;s.form=null;persist();render();window.scrollTo({top:0,behavior:'instant'})}
function switchSpace(space){s.space=space;s.page=sections[space][0][0];s.modal=null;s.form=null;persist();render();window.scrollTo({top:0,behavior:'instant'});notice(space==='personal'?'Espacio personal activo':space==='business'?'Modo negocio de ejemplo: Bruma Café':'Modo editorial de ejemplo (superadmin)')}
function badgeSpace(){return s.space==='business'?'Bruma Café · demo':s.space==='admin'?'Superadmin · demo':'Personal · demo'}
function shell(){let navs=sections[s.space];return `<div class="app"><aside class="rail"><div class="brand"><div class="mark">r</div><div><span class="brand-name">rondaza</span><small>V18 · REDISEÑO</small></div></div><div class="side-section">${s.space==='personal'?'TU PRÓXIMA SALIDA':s.space==='business'?'GESTIÓN DE NEGOCIO':'OPERACIÓN EDITORIAL'}</div>${navs.map(n=>navBtn(n)).join('')}<div class="rail-foot"><div class="scope-chip">◉ ${esc(badgeSpace())}</div><br/><span class="version-chip">v18 · edición visual</span><p class="slim muted">Datos simulados y guardados solo en este navegador.</p>${s.space!=='personal'?`<button class="quiet" data-action="switch:personal">← Volver a persona</button>`:''}</div></aside><main class="workspace"><header class="topbar"><div><span class="eyebrow" style="margin:0">SAN DIEGO + TIJUANA</span><strong>${esc(navs.find(n=>n[0]===s.page)?.[1]||'Rondaza')}</strong></div><div class="top-actions"><span class="label-pill">◌ Datos de ejemplo</span>${s.space==='business'?scopePicker():''}<button class="avatar" aria-label="Cambiar de espacio" data-action="spaces">DG</button></div></header><header class="mobile-top"><div class="brand"><div class="mark">r</div><span class="brand-name">rondaza</span></div><div class="top-actions"><span class="version-chip" style="margin:0">v18</span><button class="avatar" data-action="spaces" aria-label="Espacios">DG</button></div></header>${s.space==='business'?`<div class="mobile-business-scope">${scopePicker()}</div>`:''}<div class="content">${renderPage()}</div></main><nav class="mobile-nav" aria-label="Navegación principal">${navs.slice(0,5).map(n=>`<button data-action="nav:${n[0]}" class="${s.page===n[0]?'active':''}">${icon(n[2])}<span>${esc(n[1])}</span></button>`).join('')}</nav>${s.modal?modal():''}${s.toast?`<div class="toast" role="status" id="toast">${esc(s.toast)}</div>`:''}</div>`}
function navBtn(n){return `<button class="navlink ${s.page===n[0]?'active':''}" data-action="nav:${n[0]}">${icon(n[2])}<span>${esc(n[1])}</span></button>`}
function scopePicker(){return `<select class="selector" data-change="scope" aria-label="Seleccionar sucursal"><option value="all" ${s.scope==='all'?'selected':''}>Todas mis sucursales</option><option value="bruma1" ${s.scope==='bruma1'?'selected':''}>Bruma · Hipódromo</option><option value="bruma2" ${s.scope==='bruma2'?'selected':''}>Bruma · Zona Río</option></select>`}
const head=(upper,title,desc,actions='')=>`<div class="page-head"><div><div class="eyebrow">${upper}</div><h1 class="h1">${title}</h1><p class="lead">${desc}</p></div><div class="inline-actions">${actions}</div></div>`;
function placeCard(p){const saved=s.saved.includes(p.id);return `<article class="spot-card"><div class="spot-photo ${p.v}" ${photoStyle(p.id)}><button class="spot-photo-hit" data-action="place:${esc(p.id)}" aria-label="Abrir ${esc(p.branch)}"></button><span class="spot-photo-note">Foto ilustrativa</span><button class="spot-heart ${saved?'is-saved':''}" data-action="save:${esc(p.id)}" aria-label="${saved?'Quitar de guardados':'Guardar cafetería'}">${saved?'♥':'♡'}</button><div class="spot-photo-tag">${esc(p.type)}</div></div><div class="spot-description"><div class="spot-meta"><span>${esc(p.city)} · ${esc(p.area)}</span><span class="spot-arrow" aria-hidden="true">↗</span></div><button class="spot-title" data-action="place:${esc(p.id)}">${esc(p.name)}</button><p>${esc(p.description)}</p><div class="spot-cta"><button data-action="place:${esc(p.id)}">Ver lugar <span>↗</span></button><button data-action="routeadd:${esc(p.id)}">+ Mi ruta</button></div></div></article>`}
function pageInicio(){return `<div class="home-topline"><div><span class="eyebrow">SAN DIEGO & TIJUANA <span class="live-dot"></span></span><h1>Tu próxima <em>ronda.</em></h1><p>Buenos cafés. Mejores historias.</p></div><button class="icon-round" data-action="visit" aria-label="Compartir una visita">${icon('plus')}</button></div><section class="editorial-hero" style="--hero-photo:url('${heroPhoto}');--hero-fallback:url('${fallbackArt.hero}')"><div class="editorial-hero-content"><span class="hero-chip">✦ PARA LOS QUE AMAN EL CAFÉ</span><h2>Cada café<br/>tiene una historia.</h2><p>Descubre lugares, inspira a tus amigos y encuentra tu siguiente parada.</p><button class="hero-discover" data-action="nav:explorar">Explorar cafeterías ${icon('arrow')}</button></div><span class="hero-footnote">Fotografía ambiental ilustrativa</span></section><section class="home-circles"><div class="home-section-heading"><h2>Explora a tu manera</h2><button data-action="nav:explorar">Ver todo ${icon('arrow')}</button></div><div class="discovery-shortcuts"><button class="discovery-shortcut" data-action="nav:explorar"><span class="shortcut-visual" ${photoStyle('casa')}></span><b>Cafeterías</b></button><button class="discovery-shortcut" data-action="nav:explorar"><span class="shortcut-visual" ${photoStyle('miga')}></span><b>Pan y café</b></button><button class="discovery-shortcut" data-action="nav:eventos-personal"><span class="shortcut-visual" ${photoStyle('taller')}></span><b>Eventos</b></button><button class="discovery-shortcut" data-action="clubs-personal"><span class="shortcut-visual shortcut-club">✳</span><b>Mis clubes</b></button></div></section><div class="home-section-heading home-social-heading"><div><span class="eyebrow">DE LA COMUNIDAD</span><h2>Lo que está pasando</h2></div><button data-action="visit">+ Publicar visita</button></div><div class="home-columns"><div class="home-feed">${s.visits.slice().reverse().map((v,i)=>feedItem('DG',v.text,v.placeId,v.date,'Tú',v.id||'mine-'+i)).join('')}${feedItem('AM','Volví por el latte de la casa y terminé quedándome toda la tarde en el patio. ☕','casa','Hace 2 h','Ana M.','seed-ana')}${feedItem('JL','El croissant de almendra salió tibio. Esta parada merece entrar en la ruta del sábado.','miga','Ayer','Julián L.','seed-julian')}</div><aside class="home-aside"><div class="aside-feature" style="--aside-photo:url('${eventPhoto}');--aside-fallback:url('${fallbackArt.event}')"><span class="aside-chip">EN TU CIUDAD</span><h3>Una nueva forma de conectar.</h3><p>Descubre encuentros y experiencias alrededor del café.</p><button data-action="nav:eventos-personal">Ver agenda ${icon('arrow')}</button><span class="aside-photo-note">Imagen ilustrativa</span></div><div class="aside-route"><div class="aside-row"><span class="aside-glyph">↗</span><span>PRÓXIMA AVENTURA</span></div><h3>Tu ruta, a tu ritmo.</h3><p>Tienes ${s.route.length} ${s.route.length===1?'parada guardada':'paradas guardadas'} para tu próximo recorrido.</p><button data-action="nav:rutas">Planear ruta ${icon('arrow')}</button></div><div class="aside-loyalty"><div class="aside-row"><span class="aside-glyph">✳</span><span>TU CLUB DE CAFÉ</span></div>${stampCard('bruma1')}<button data-action="clubs-personal">Ver mis tarjetas ${icon('arrow')}</button></div></aside></div><p class="editorial-disclaimer">Rondaza es un prototipo: lugares, fotografías y publicaciones de esta demo son ilustrativos.</p>`}
function feedItem(initials,body,placeId,date,who='Tú',postId=''){const p=place(placeId),saved=!!p&&s.saved.includes(p.id),onRoute=!!p&&s.route.includes(p.id),liked=s.feedLikes.includes(postId),valid=!!p;return `<article class="social-post social-post-v18"><div class="social-author"><span class="initial ${initials==='DG'?'green':''}">${esc(initials)}</span><div class="author-title"><b>${esc(who)}</b><div class="meta">${esc(date)} · ${esc(p?.city||'')}</div></div><button class="post-ellipsis" aria-label="Información de la publicación" data-action="${valid?'place:'+esc(p.id):'nav:inicio'}">···</button></div>${valid?`<div class="post-photo ${esc(p.v)}" ${photoStyle(p.id)}><button class="post-photo-hit" data-action="place:${esc(p.id)}" aria-label="Ver ${esc(p.branch)}"></button><span class="post-photo-note">Imagen de referencia</span><button class="post-location" data-action="place:${esc(p.id)}">${icon('map')}<span><b>${esc(p.name)}</b><small>${esc(p.area)} · ${esc(p.city)}</small></span><span>↗</span></button></div>`:''}<div class="post-social-row"><button class="post-icon-btn ${liked?'liked':''}" data-action="likePost:${esc(postId)}" aria-label="${liked?'Quitar me gusta':'Me gusta'}">${liked?'♥':'♡'}</button><button class="post-icon-btn" data-action="${valid?'meetupStart:'+p.id+':'+encodeURIComponent(who):'nav:inicio'}" aria-label="Proponer encuentro">${icon('calendar')}</button><span class="post-spacer"></span>${valid?`<button class="post-icon-btn ${saved?'liked':''}" data-action="save:${esc(p.id)}" aria-label="Guardar cafetería">${saved?'♥':icon('bookmark')}</button>`:''}</div><p class="social-copy"><b>${esc(who)}</b> ${esc(body)}</p>${valid?`<div class="post-quick-actions"><button data-action="save:${esc(p.id)}">${saved?'✓ Guardado':'♡ Guardar'}</button><button data-action="routeadd:${esc(p.id)}">${onRoute?'✓ En mi ruta':'+ Añadir a ruta'}</button><button data-action="meetupStart:${esc(p.id)}:${encodeURIComponent(who)}">Proponer plan ↗</button></div>`:'<div class="banner">Esta cafetería ya no está disponible en el catálogo.</div>'}</article>`}
function pageExplorar(){const f=s.exploreFilter||'Todos';const filtered=places.filter(p=>(p.name+' '+p.area+' '+p.city+' '+p.type+' '+p.product).toLowerCase().includes(s.placeSearch.toLowerCase())&&(f==='Todos'||(f==='Cafés'&&p.type.includes('Cafetería'))||(f==='Panadería'&&p.type.includes('Panadería'))||(f==='Tostadores'&&p.type.includes('Tostador'))||p.city===f));return `<div class="explore-header"><span class="eyebrow">ENCUENTRA TU SIGUIENTE FAVORITO</span><h1>Explora <em>sin prisa.</em></h1><p>Pequeños lugares, grandes descubrimientos. Empieza por lo que te apetece.</p><div class="explore-search">${icon('map')}<input data-input="placeSearch" placeholder="Cafetería, ciudad, barrio o especialidad…" value="${esc(s.placeSearch)}" aria-label="Buscar cafeterías"/><button data-action="nav:eventos-personal">Eventos ↗</button></div><div class="explore-pills" aria-label="Filtros de cafeterías">${['Todos','Cafés','Panadería','Tostadores','Tijuana','San Diego'].map(v=>`<button data-action="exploreFilter:${esc(v)}" aria-pressed="${f===v}" class="${f===v?'selected':''}">${esc(v)}</button>`).join('')}</div></div><div class="explore-summary"><div><h2>${f==='Todos'?'Lugares para descubrir':esc(f)}</h2><span>${filtered.length} ${filtered.length===1?'lugar':'lugares'} · fotografías ilustrativas</span></div><button data-action="nav:guardados">Mis guardados ${icon('arrow')}</button></div><div class="spot-grid">${filtered.map(placeCard).join('')||'<div class="empty">No encontramos lugares para esa búsqueda. Prueba otra categoría o zona.</div>'}</div><p class="editorial-disclaimer">Los nombres, ubicaciones y fotografías son ejemplos para probar Rondaza; valida la dirección antes de viajar.</p>`}
function pageGuardados(){return `<div class="explore-header saved-header"><span class="eyebrow">TU LISTA PERSONAL</span><h1>Lugares que <em>inspiran.</em></h1><p>Guárdalos hoy. Visítalos cuando quieras. Ningún café se queda atrás.</p><button class="saved-add" data-action="nav:explorar">${icon('plus')} Descubrir más lugares</button></div><div class="explore-summary"><div><h2>Mis favoritos</h2><span>${s.saved.length} ${s.saved.length===1?'lugar guardado':'lugares guardados'}</span></div><button data-action="nav:rutas">Organizar ruta ${icon('arrow')}</button></div>${s.saved.length?`<div class="spot-grid">${s.saved.map(id=>place(id)).filter(Boolean).map(placeCard).join('')}</div>`:'<div class="saved-empty"><span>♡</span><h3>Tu próxima cafetería favorita está por descubrir.</h3><p>Explora nuevos lugares y guárdalos aquí para futuras visitas.</p><button data-action="nav:explorar">Descubrir cafeterías →</button></div>'}`}
function pageRutas(){const lines=s.route.map((id,i)=>{const p=place(id);return p?`<div class="route-stop"><span class="initial">${i+1}</span><div class="route-stop-content"><b>${esc(p.branch)}</b><div class="meta">${esc(mapTerm(id)||p.city+' · '+p.area)}</div>${!hasAddress(id)?`<div class="meta" style="color:#a35c35">Dirección pendiente</div>`:''}</div><div class="inline-actions">${hasAddress(id)?btn('↗ Mapa','mapPlace:google:'+id,'ghost small'):''}${btn('↑','up:'+i,'ghost small',i===0?'disabled':'')}${btn('↓','down:'+i,'ghost small',i===s.route.length-1?'disabled':'')}${btn('Quitar','remove:'+id,'secondary small')}</div></div>`:''}).join('');return `${head('PLANEA UNA SALIDA','Mis rutas.','Prepara una salida aquí y abre las paradas directamente en Google Maps o Apple Maps.',btn('+ Crear ruta','newroute'))}<div class="grid two"><div class="card"><div class="row"><h3>${esc(s.routeName)}</h3>${t(s.routeShared?'Compartida':'Privada',s.routeShared?'':'amber')}</div><p>Puedes reordenar las paradas antes de exportar el recorrido.</p>${lines||'<p>Empieza añadiendo un lugar desde Explorar.</p>'}<div class="inline-actions" style="margin-top:20px">${btn('+ Agregar parada','nav:explorar','secondary')}${btn('Compartir ruta','share-route','secondary',s.route.length<2?'disabled':'')}</div></div><div class="stack">${routeExportSection()}${meetupsSection()}<div class="card"><div class="row"><h3>Sugerencias pendientes</h3>${t(String(s.routeSuggestions.filter(x=>x.status==='pending').length),'neutral')}</div>${s.routeSuggestions.length?s.routeSuggestions.map((x,i)=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><div class="row"><b>${esc(place(x.place)?.branch||'Lugar')}</b>${t(x.status,x.status==='pending'?'amber':'neutral')}</div><p>${esc(x.note)}</p>${x.status==='pending'?`<div class="inline-actions">${btn('Aceptar','acceptSuggestion:'+i,'ghost small')}${btn('Descartar','rejectSuggestion:'+i,'secondary small')}</div>`:''}</div>`).join(''):'<p>Todavía no hay propuestas de paradas.</p>'}${btn('Simular sugerencia de un amigo','suggest-route','secondary full')}</div></div></div>`}

function meetingSummary(m){const p=place(m.placeId);return [`¿Nos vemos para un café en ${p?.branch||'esta cafetería'}?`,m.date&&m.time?`Fecha: ${dateLabel(m.date)} a las ${m.time}`:'',p?.city?`Lugar: ${p.branch} · ${p.city}, ${p.area}`:'',hasAddress(m.placeId)?`Dirección: ${mapTerm(m.placeId)}`:'',m.invited?`Para: ${m.invited}`:'',m.note?`Mensaje: ${m.note}`:'','Plan creado con Rondaza (demo; sin reserva confirmada).'].filter(Boolean).join('\n')}
function meetupsSection(){return `<section class="card"><div class="row"><div><div class="eyebrow">PLANES ENTRE AMIGOS</div><h3>Encuentros propuestos</h3></div>${t(String(s.meetupDrafts.length),'neutral')}</div><p>Organiza desde una recomendación del feed. Los planes se guardan aquí; compartir es una acción separada y no reserva lugares.</p>${s.meetupDrafts.length?`<div class="stack" style="gap:10px;margin-top:14px">${s.meetupDrafts.map(m=>{const p=place(m.placeId);return `<div class="meetup-draft"><div><b>${esc(p?.branch||'Lugar')}</b><div class="meta">${esc(dateLabel(m.date))} · ${esc(m.time)} · ${esc(m.invited||'Invitación por compartir')}</div>${m.note?`<p>${esc(m.note)}</p>`:''}</div><div class="inline-actions">${btn('Compartir texto','meetupReady:'+m.id,'secondary small')}${btn('Eliminar','meetupDelete:'+m.id,'ghost small')}</div></div>`}).join('')}</div>`:'<div class="empty" style="padding:17px"><p>Desde el feed, pulsa “Proponer encuentro” en una visita de un amigo.</p></div>'}</section>`}
function pageCuenta(){return `${head('TU PERFIL','Tu espacio.','Una identidad para disfrutar Rondaza y, si tienes permisos, gestionar negocios.') }<div class="grid two"><div class="card"><div class="feed-row"><span class="initial green">DG</span><div><h3>Tu perfil</h3><p>Cuenta demostrativa · Español</p></div></div><div class="hr"></div><h3>Funciones personales</h3><div class="stack">${btn('Mis clubes y recompensas →','clubs-personal','secondary full')}${btn('Mis rutas →','nav:rutas','secondary full')}${btn('Mis guardados →','nav:guardados','secondary full')}</div></div><div class="card"><h3>Cambiar de espacio</h3><p>Un mismo perfil puede operar varias sucursales. Las vistas de negocio y administración tienen permisos distintos.</p>${spaceCards()}<p class="slim muted">Los permisos en v18 son simulados: cambiar de espacio no constituye autorización real.</p></div></div>`}
function spaceCards(){return `<div class="stack"><button class="radio-choice ${s.space==='personal'?'active':''}" data-action="switch:personal"><span>👤</span><span><b>Personal</b><br/><small class="muted">Descubrir, rutas, visitas y clubes</small></span></button><button class="radio-choice ${s.space==='business'?'active':''}" data-action="switch:business"><span>🏪</span><span><b>Bruma Café · Gerente demo</b><br/><small class="muted">Hipódromo y Zona Río autorizadas</small></span></button><button class="radio-choice ${s.space==='admin'?'active':''}" data-action="switch:admin"><span>🛡️</span><span><b>Rondaza · Editorial demo</b><br/><small class="muted">Superadministración simulada</small></span></button></div>`}
function pageEventsPersonal(){const evs=s.events.filter(e=>e.kind==='public'&&['published','cancelled','postponed'].includes(e.status));return `${head('AGENDA DE CAFÉ','Eventos.','Descubre experiencias y consulta sus detalles. Rondaza no cobra entradas ni procesa pagos; los registros externos se realizan con el organizador.',btn('+ Proponer evento','event-public'))}<div class="toolbar"><button class="tab ${s.cityFilter==='Todos'?'active':''}" data-action="city:Todos">Todas</button><button class="tab ${s.cityFilter==='Tijuana'?'active':''}" data-action="city:Tijuana">Tijuana</button><button class="tab ${s.cityFilter==='San Diego'?'active':''}" data-action="city:San Diego">San Diego</button></div><div class="grid">${evs.filter(x=>s.cityFilter==='Todos'||x.city===s.cityFilter).map(eventCard).join('')||'<div class="empty">No hay eventos con estos filtros.</div>'}</div><div class="section-head"><h2>¿Conoces un encuentro?</h2></div><div class="card"><p>Cualquier persona puede enviar una propuesta. Solo el equipo editorial puede publicarla en la agenda.</p>${btn('Enviar una propuesta →','event-public')}</div>`}
function eventCard(e){return `<article class="card modern-event-card"><div class="event-photo" style="--spot-photo:url('${eventPhoto}');--spot-fallback:url('${fallbackArt.event}')"><span>AGENDA DE CAFÉ · ${esc(e.city)}</span><small>Fotografía ilustrativa</small></div><div class="modern-event-inner"><div class="row"><h3>${esc(e.title)}</h3>${t(e.status==='published'?'Publicado':e.status,e.status==='published'?'':'rose')}</div><div class="meta">${icon('calendar')} ${esc(dateLabel(e.date))} · ${esc(e.time)} · ${esc(e.city)}</div><p>${esc(e.description||'')}</p><p class="slim muted">Lugar: ${esc(e.location)} · Demo</p>${btn('Ver detalles →','eventDetail:'+e.id,'secondary full')}</div></article>`}

function businessPosts(){const relevant=s.businessPosts.filter(p=>s.scope==='all'||p.locations.includes(s.scope));return `${head('BRUMA CAFÉ','Publicaciones.','Una publicación puede aparecer en varias sucursales, pero conserva un solo ID.',btn('+ Publicar novedad','businessPost'))}<div class="banner">La opción “Todas” comprende únicamente las dos sucursales autorizadas en esta demo. No otorga acceso a otras franquicias.</div><div class="section-head"><h2>Publicaciones del negocio</h2><div class="scope-chip">${s.scope==='all'?'Todas mis sucursales':esc(place(s.scope)?.branch)}</div></div><div class="stack">${relevant.map(p=>`<article class="card"><div class="row"><b>Bruma Café</b>${t('Orgánico')}</div><p style="font-size:15px;color:var(--dark)">${esc(p.text)}</p><div class="meta">${esc(p.locations.map(x=>place(x)?.area||x).join(' · '))} · ID ${esc(p.id)}</div><div class="hr"></div><div class="inline-actions">${btn('Ver alcance','postDetail:'+p.id,'secondary small')}${btn('Compartir enlace','sharePost:'+p.id,'ghost small')}</div></article>`).join('')||'<div class="empty">Sin publicaciones en esta sucursal.</div>'}</div>`}
function businessEvents(){const relevant=s.events.filter(e=>e.kind==='private'&&(s.scope==='all'||e.branch===s.scope));const proposals=s.events.filter(e=>e.kind==='public'&&e.origin==='business'&&(s.scope==='all'||e.branch===s.scope));return `${head('ORGANIZA','Eventos de negocio.','Eventos privados e invitaciones en tu sucursal. Las propuestas públicas se revisan aparte.',btn('+ Crear evento','event-business'))}<div class="grid two"><div class="card"><div class="row"><h3>Encuentros privados</h3>${t('No aparecen en agenda','amber')}</div><p>Invitaciones y RSVP solo para personas con enlace válido.</p>${relevant.length?relevant.map(e=>`<div class="hr"></div><b>${esc(e.title)}</b><p>${esc(dateLabel(e.date))} · ${esc(place(e.branch)?.area||'')}</p>${t(e.status)}<div style="margin-top:11px">${btn('Gestionar','eventDetail:'+e.id,'secondary small')}</div>`).join(''):'<div class="empty">No has creado encuentros privados.</div>'}</div><div class="card"><div class="row"><h3>Propuestas al calendario</h3>${t('Revisión editorial')}</div><p>El envío no publica el evento. Los cambios oficiales requieren aprobación de Rondaza.</p>${proposals.length?proposals.map(e=>`<div class="hr"></div><b>${esc(e.title)}</b><p>${esc(dateLabel(e.date))}</p>${t(e.status,e.status==='proposed'?'amber':'neutral')}`).join(''):'<div class="empty">No hay propuestas enviadas.</div>'}${btn('Proponer a Rondaza →','event-public','secondary full')}</div></div>`}
function pageClubBusiness(){const shared=sharedClub();const modeBox=`<section class="card catalog-mode"><div><div class="eyebrow">ALCANCE DEL PROGRAMA</div><h3>¿Dónde puede ganar y usar sellos el cliente?</h3><p>Elige una tarjeta por sede o una sola tarjeta para ambas sucursales autorizadas. Los cambios de modalidad nunca suman saldos de programas diferentes.</p></div><div class="mode-buttons"><button class="mode-card ${!shared?'selected':''}" data-action="loyaltyMode:branch" aria-pressed="${!shared}"><span class="mode-emoji">▦</span><b>Por sucursal</b><small>Saldo y diseño independientes</small></button><button class="mode-card ${shared?'selected':''}" data-action="loyaltyMode:shared" aria-pressed="${shared}"><span class="mode-emoji">◎</span><b>Compartida</b><small>Una tarjeta, dos sedes</small></button></div></section>`;
 if(s.scope==='all')return `${head('BRUMA CAFÉ · LEALTAD','Tarjetas de lealtad.','Configura cómo se usan tus tarjetas en las sucursales autorizadas.')}${modeBox}<div class="banner" style="margin-bottom:18px">${shared?'Los sellos y el límite diario se acumulan entre Hipódromo y Zona Río. Para registrar una visita, selecciona la sede donde ocurrió.':'Cada sucursal mantiene su diseño, sellos y límites independientes. Selecciona una para editar.'}</div><div class="grid ${shared?'shared-overview':'two'} wallet-grid">${(shared?['bruma1']:branches).map(id=>{const pr=effectiveProgram(id);return `<article class="card wallet-item">${stampCard(id)}<h3 style="margin-top:20px">${shared?'Bruma · Tarjeta compartida':esc(place(id).branch)}</h3><p>${shared?'Disponible en las dos sedes':'Programa exclusivo de esta sucursal'}</p>${clubRules(pr)}<div class="inline-actions" style="margin-top:16px">${shared?btn('Diseñar tarjeta compartida','configClub','primary'):btn('Administrar esta sucursal →','setScope:'+id,'secondary full')}</div></article>`}).join('')}</div>${shared?`<div class="section-head"><h2>Registrar compras por sede</h2></div><div class="grid two">${branches.map(id=>`<div class="card"><h3>${esc(place(id).branch)}</h3><p>Los sellos van al mismo programa compartido.</p>${btn('Gestionar visitas →','setScope:'+id,'secondary')}</div>`).join('')}</div>`:''}`;
 const id=s.scope,pr=effectiveProgram(id),a=stampCount(id),log=branchLedger(id),perVisit=Number(pr.perVisit)||1,perDay=Number(pr.perDay)||1;
 return `${head('BRUMA CAFÉ · LEALTAD',`Club · ${esc(place(id).area)}.`,shared?'Compartes el diseño y saldo con la otra sede; las visitas se atribuyen a la sede seleccionada.':'Las reglas y el saldo pertenecen solo a esta sucursal.',btn('✦ Diseñar tarjeta y reglas','configClub','primary'))}${modeBox}<div class="business-loyalty-layout"><div class="card business-preview"><div class="row"><h3>Así se ve la tarjeta del cliente</h3>${t(pr.status==='active'?'Activo':pr.status,pr.status==='active'?'':'amber')}</div>${stampCard(id)}${clubRules(pr)}<p class="slim muted">${clubLocationText()}</p>${btn('Personalizar tarjeta →','configClub','secondary full')}</div><div class="stack"><div class="card"><div class="eyebrow">${shared?'PROGRAMA COMPARTIDO':'PROGRAMA DE SEDE'}</div><h3>${esc(pr.reward)}</h3><p>${esc(pr.description||'Reglas no definidas')}</p><div class="mini-metrics"><div><b>${pr.target}</b><small>sellos / premio</small></div><div><b>${perVisit}</b><small>máx. / visita</small></div><div><b>${perDay}</b><small>máx. / día ${shared?'entre sedes':''}</small></div></div>${btn(pr.status==='active'?'Pausar programa':'Activar programa','toggleClub','ghost small')}</div><div class="card"><div class="row"><h3>Simulador de sellos</h3>${t('Demo local','amber')}</div><p>${shared?'Se registra la sede de la visita. El límite diario se comparte entre ambas; el límite por visita se mide en la sede actual.':'Cada sello se suma únicamente a esta tarjeta.'}</p><div class="stamp-usage"><div><span>Hoy ${shared?'en ambas sedes':''}</span><b>${log.total} / ${perDay}</b></div>${progress(log.total,perDay)}<div><span>Visita actual en ${esc(place(id).area)}</span><b>${log.perVisit} / ${perVisit}</b></div>${progress(log.perVisit,perVisit)}</div><div class="inline-actions">${btn('+ 1 sello','addStamp','primary',pr.status!=='active'||log.total>=perDay||log.perVisit>=perVisit?'disabled':'')}${btn('Nueva visita','newVisit','secondary',pr.status!=='active'||log.total>=perDay?'disabled':'')}${btn('Canjear','redeem','ghost',pr.status!=='active'||a<pr.target?'disabled':'')}</div><p class="slim muted">Sello simulado. No se valida compra ni QR real.</p></div></div></div>`}
function pageAvisos(){return `${head('COMUNICACIÓN','Avisos.','Solo quienes aceptaron avisos promocionales de una sucursal pueden recibirlos.')}<div class="card"><h3>Campañas de negocio</h3><p>Esta vista está diseñada para mostrar alcance, canales y consentimiento. Los envíos reales de push y correo están fuera del prototipo.</p><div class="banner">La inscripción al club no implica consentimiento de marketing. La audiencia se calcula de forma independiente por sucursal y canal.</div><div class="section-head"><h2>Estado del módulo</h2>${t('Simulación','amber')}</div>${btn('Ver ejemplo de segmentación','campaignPreview','secondary')}</div>`}
function pageMas(){return `${head('OPERACIÓN','Sucursales y direcciones.','Configura una dirección independiente para cada sede de Bruma Café.')}<div class="banner">Las direcciones se guardan solo en esta demo; antes de un lanzamiento real necesitarán validación y derechos de edición por sucursal.</div>${locationList(['bruma1','bruma2'])}<div class="card" style="margin-top:20px"><h3>Acceso y permisos</h3><p>En producción solo operadores verificados pueden editar sus sucursales. Para otras cafeterías utiliza la revisión editorial.</p>${btn('Ir a avisos','nav:avisos','secondary')}</div>`}

function adminReview(){const proposals=s.events.filter(e=>e.kind==='public'&&e.status==='proposed');return `${head('RONDAZA · MODERACIÓN','Propuestas.','Solo el superadministrador decide qué aparece en la agenda general.',btn('Agenda publicada','nav:agenda','secondary'))}<div class="grid four"><div class="card mini-stat"><span class="caption">Pendientes</span><span class="number">${proposals.length}</span></div><div class="card mini-stat"><span class="caption">Publicados</span><span class="number">${s.events.filter(e=>e.kind==='public'&&e.status==='published').length}</span></div><div class="card mini-stat"><span class="caption">Borradores</span><span class="number">${s.events.filter(e=>e.status==='draft').length}</span></div><div class="card mini-stat"><span class="caption">Cancelados</span><span class="number">${s.events.filter(e=>e.status==='cancelled').length}</span></div></div><div class="section-head"><h2>Revisión editorial</h2></div>${proposals.length?`<div class="stack">${proposals.map(e=>`<div class="card"><div class="row"><div><h3>${esc(e.title)}</h3><p>${esc(e.city)} · ${esc(dateLabel(e.date))} · ${esc(e.source)}</p></div>${t('Pendiente','amber')}</div><p>${esc(e.description)}</p><div class="inline-actions">${btn('Publicar en agenda','approve:'+e.id,'primary')}${btn('Rechazar','rejectEvent:'+e.id,'secondary')}${btn('Revisar detalles','eventDetail:'+e.id,'ghost')}</div></div>`).join('')}</div>`:'<div class="empty"><h3>Sin propuestas por revisar</h3><p>Crea una desde Persona o Negocio y vuelve aquí para probar la aprobación.</p></div>'}`}
function adminAgenda(){return `${head('RONDAZA · EDITORIAL','Agenda pública.','Publicaciones oficiales, cambios y cancelaciones con control central.',btn('+ Borrador editorial','event-editorial'))}<div class="card table-wrap"><table class="table"><thead><tr><th>Evento</th><th>Fecha local</th><th>Ciudad</th><th>Estado</th><th>Acción</th></tr></thead><tbody>${s.events.filter(e=>e.kind==='public').map(e=>`<tr><td><b>${esc(e.title)}</b></td><td>${esc(dateLabel(e.date))}</td><td>${esc(e.city)}</td><td>${t(e.status,e.status==='published'?'':'amber')}</td><td>${btn('Gestionar','eventDetail:'+e.id,'secondary small')}</td></tr>`).join('')}</tbody></table></div>`}
function adminAudit(){return `${head('TRAZABILIDAD','Auditoría.','La producción necesita registros inmutables por actor, recurso y operación.') }<div class="card"><h3>Contrato de eventos y permisos</h3><div class="timeline"><div class="timepoint"><span class="dot"></span><div><b>Proponer</b><p>Usuario o negocio envía borrador privado</p></div></div><div class="timepoint"><span class="dot"></span><div><b>Revisar y aprobar</b><p>Solo superadmin puede publicar en agenda</p></div></div><div class="timepoint"><span class="dot"></span><div><b>Cambiar o cancelar</b><p>Preservar motivo, historial y visibilidad de estado</p></div></div></div><div class="banner">En esta versión los cambios persisten únicamente en localStorage; no hay auditoría real ni aislamiento entre usuarios.</div></div>`}
function adminConfig(){return `${head('RONDAZA · CONFIG','Configuración editorial.','Reglas centralizadas de publicación y moderación.') }<div class="card"><h3>Reglas vigentes de diseño</h3><p>◉ Propuestas no publicadas nunca aparecen en el calendario público.</p><p>◉ Sólo la superadministración valida, publica, modifica o cancela eventos generales.</p><p>◉ Un negocio puede organizar encuentros privados para invitados sin entrar en agenda.</p><p>◉ El nivel de suscripción no concede permisos editoriales.</p>${btn('Revisar propuestas','nav:revision','secondary')}</div><div class="section-head"><h2>Catálogo y direcciones de ejemplo</h2></div><div class="banner">Las fichas de demostración no tienen direcciones reales preestablecidas. Edita una ficha y añade una dirección comprobada antes de abrir navegación.</div>${locationList(places.map(p=>p.id))}`}
function renderPage(){if(s.space==='personal')return ({inicio:pageInicio,explorar:pageExplorar,guardados:pageGuardados,rutas:pageRutas,cuenta:pageCuenta,'eventos-personal':pageEventsPersonal,'clubs-personal':pageClubsPersonal})[s.page]?.()||pageInicio();if(s.space==='business')return ({posts:businessPosts,eventos:businessEvents,club:pageClubBusiness,designer:pageClubDesigner,menu:pageMenuBusiness,avisos:pageAvisos,mas:pageMas})[s.page]?.()||businessPosts();return ({revision:adminReview,agenda:adminAgenda,auditoria:adminAudit,config:adminConfig})[s.page]?.()||adminReview()}
const THEMES={espresso:{name:'Cacao & cream',bg:'#4a2d27',ink:'#fff8ed'},sage:{name:'Sage atelier',bg:'#264b42',ink:'#fff7e7'},clay:{name:'Terracotta',bg:'#9b4f3d',ink:'#fff8ef'},midnight:{name:'Midnight roast',bg:'#1d242b',ink:'#f6eee4'},oat:{name:'Oat milk',bg:'#e7d5bd',ink:'#342c26'}};
const GLYPHS={coffee:'☕',star:'✦',bean:'◉',heart:'♥',croissant:'🥐',flower:'✿'};
function localeDay(){const parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/Tijuana',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const get=t=>parts.find(x=>x.type===t)?.value||'00';return `${get('year')}-${get('month')}-${get('day')}`}
function branchLedger(id){const day=localeDay(),pid=activeStampProgram(id),rows=s.stampEvents.filter(e=>(e.programId||e.branch)===pid&&e.day===day),visit=s.currentVisits[visitKey(id)];return {day,total:rows.reduce((a,e)=>a+e.count,0),visit:visit?.day===day?visit:null,perVisit:visit&&visit.day===day?rows.filter(e=>e.visitId===visit.id&&e.branch===id).reduce((a,e)=>a+e.count,0):0}}
function safeCover(url){return typeof url==='string'&&/^data:image\/(?:jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(url)?url:''}
function stampCard(id,opts={}){const pr=opts.program||effectiveProgram(id),p=place(id),theme=THEMES[pr.cardStyle]||THEMES.espresso,accent=/^#[0-9a-fA-F]{6}$/.test(pr.accent||'')?pr.accent:'#dfbd90',a=opts.preview?Math.min(Number(pr.target)||6,3):joinedClub(id)?stampCount(id):0,target=Math.min(20,Math.max(2,Number(pr.target)||6)),ratio=Math.min(a,target),glyph=GLYPHS[pr.stampGlyph]||GLYPHS.coffee,cover=safeCover(pr.cover),logo=safeCover(pr.logo),shared=sharedClub();return `<div class="loyalty-card ${target>12?'dense':''} theme-${esc(pr.cardStyle||'espresso')}" role="img" aria-label="Tarjeta ${shared?'compartida en dos sedes':'de '+p.branch}: ${a} de ${target} sellos" style="--card-accent:${accent};--card-bg:${theme.bg};--card-ink:${theme.ink};${cover?`--cover-image:url('${cover}');`:''}"><div class="loyalty-gloss"></div><div class="loyalty-orb"></div><div class="loyalty-front"><div class="loyalty-top"><span class="loyalty-brandmark">${logo?`<img src="${logo}" alt=""/>`:esc(p.name.charAt(0).toUpperCase())}</span><div class="loyalty-brand"><span>${esc(pr.cardTitle||p.name)}</span><small>${esc(pr.tagline||'YOUR COFFEE, YOUR RITUAL')}</small></div><span class="loyalty-rondaza">rondaza<span>®</span></span></div><div class="loyalty-mid"><div class="loyalty-label">${shared?'DOS SEDES • UNA SOLA TARJETA':'MEMBERSHIP • '+esc(p.area.toUpperCase())}</div><div class="loyalty-claim">${esc(pr.reward)}</div></div><div class="loyalty-stamps" style="--stamp-columns:${target>12?7:target>8?6:target>6?5:target>4?target:Math.max(target,3)}">${Array.from({length:target},(_,i)=>`<span class="loyalty-stamp ${i<ratio?'earned':''}" title="${i<ratio?'Sello ganado':'Sello pendiente'}" aria-hidden="true">${i<ratio?'✓':esc(glyph)}</span>`).join('')}</div><div class="loyalty-bottom"><span>${opts.preview?'VISTA PREVIA':'MEMBER · DG 0001'}</span><span>${shared?'HIPÓDROMO + ZONA RÍO':'COFFEE CLUB'}</span></div></div></div>`}
function clubRules(pr){return `<div class="club-rule-pills"><span>◉ ${Number(pr.perVisit)||1} ${Number(pr.perVisit)===1?'sello':'sellos'} / visita</span><span>◷ Máx. ${Number(pr.perDay)||1} / día</span><span>✦ ${Number(pr.target)||6} para premio</span></div>`}
function pageClubDesigner(){if(s.scope==='all'&&!sharedClub()){s.page='club';return pageClubBusiness()};const id=s.scope==='all'?'bruma1':s.scope,p=place(id),f=s.form||{...effectiveProgram(id)},shared=sharedClub();return `${head('ESTUDIO DE TARJETAS','Diseña tu club.',shared?'Configuración compartida: los cambios se verán en ambas sucursales autorizadas.':`Tarjeta propia para ${esc(p.branch)}.`,btn('← Volver al club','cancelClubDesigner','secondary'))}<div class="designer-layout"><div class="designer-preview"><p class="eyebrow">ASÍ LA VERÁ TU CLIENTE</p><div id="club-card-preview">${stampCard(id,{program:f,preview:true})}</div><div id="rules-live">${clubRules(f)}</div><div class="designer-hint">Los sellos visibles en la tarjeta muestran el progreso. La vista previa usa 3 sellos de ejemplo.</div><div class="designer-note"><b>Alcance: ${shared?'ambas sedes':'una sucursal'}</b><p>Los límites diarios del programa compartido aplican al total de visitas entre sedes. En producción: reglas versionadas y control de permisos.</p></div></div><div class="designer-settings"><section class="card studio-section"><div class="row"><h3>01 · Identidad visual</h3>${t(shared?'Marca compartida':'Sucursal','neutral')}</div><p>Personaliza la tarjeta con identidad propia de tu cafetería.</p>${field('cardTitle','Nombre visible en tarjeta','text',f.cardTitle||p.name,true,'maxlength="35"')}${field('tagline','Frase de la marca','text',f.tagline||'YOUR COFFEE CLUB',false,'maxlength="40"')}<div class="field-group"><label>Paleta base</label><div class="theme-swatches">${Object.entries(THEMES).map(([key,th])=>`<button type="button" class="theme-swatch ${f.cardStyle===key?'selected':''}" data-action="theme:${key}" title="${esc(th.name)}" aria-label="${esc(th.name)}" aria-pressed="${f.cardStyle===key}"><span style="background:${th.bg}"></span><small>${esc(th.name)}</small></button>`).join('')}</div></div><div class="designer-field-row"><div class="field-group"><label for="f-accent">Color de sellos</label><input type="color" class="field color-field" data-form="accent" id="f-accent" value="${esc(f.accent||'#dfbd90')}"/></div>${selectField('stampGlyph','Símbolo del sello',Object.entries(GLYPHS).map(([k,v])=>[k,v+' '+({coffee:'Café',star:'Estrella',bean:'Grano',heart:'Corazón',croissant:'Croissant',flower:'Flor'}[k])]),f.stampGlyph||'coffee')}</div><div class="designer-field-row"><div class="field-group"><label for="card-cover">Imagen de fondo</label><input id="card-cover" class="upload-input" data-upload="cover" type="file" accept="image/png,image/jpeg,image/webp"/><small>Foto propia de hasta 5 MB; se comprime para la demo.</small>${btn('Quitar fondo','clearImage:cover','ghost small')}</div><div class="field-group"><label for="card-logo">Logo</label><input id="card-logo" class="upload-input" data-upload="logo" type="file" accept="image/png,image/jpeg,image/webp"/><small>PNG, JPEG o WebP.</small>${btn('Quitar logo','clearImage:logo','ghost small')}</div></div></section><section class="card studio-section"><div class="row"><h3>02 · Sellos y recompensas</h3>${t(shared?'Válido en ambas sedes':'Por sucursal','neutral')}</div><div class="designer-field-row">${field('target','Sellos para completar tarjeta','number',f.target,true,'min="2" max="20" step="1"')}${field('perVisit','Máximo por visita','number',f.perVisit||1,true,'min="1" max="10" step="1"')}</div><div class="designer-field-row">${field('perDay','Máximo diario'+(shared?' (entre sedes)':''),'number',f.perDay||1,true,'min="1" max="20" step="1"')}${field('reward','Recompensa al completar','text',f.reward,true,'maxlength="70"')}</div>${textField('description','Condiciones y compras elegibles',f.description||'',true)}<div class="banner">${shared?'Compartir tarjeta implica compartir el saldo y el límite diario de sellos, sin duplicar visitas.':'Los límites se aplican únicamente a esta sucursal.'} Demo sin validación de pagos.</div></section><div class="designer-savebar">${btn('Cancelar','cancelClubDesigner','seconda function refreshClubDesigner(){if(s.space!=='business'||s.page!=='designer'||!s.form)return;const prev=document.getElementById('club-card-preview'),rules=document.getElementById('rules-live');if(prev)prev.innerHTML=stampCard(s.scope==='all'?'bruma1':s.scope,{program:s.form,preview:true});if(rules)rules.innerHTML=clubRules(s.form);document.querySelectorAll('.theme-swatch').forEach(el=>{let yes=el.dataset.action==='theme:'+s.form.cardStyle;el.classList.toggle('selected',yes);el.setAttribute('aria-pressed',String(yes))})}
async function handleImageUpload(input){const f=input.files?.[0],name=input.dataset.upload;if(!f||!['cover','logo'].includes(name))return;if(f.size>5*1024*1024||!['image/jpeg','image/png','image/webp'].includes(f.type))return notice('Sube un PNG, JPEG o WebP de hasta 5 MB');try{const url=URL.createObjectURL(f);const img=new Image();await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});const max=name==='logo'?320:1200,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);s.form[name]=canvas.toDataURL(name==='logo'?'image/png':'image/jpeg',.79);URL.revokeObjectURL(url);refreshClubDesigner();notice('Imagen lista para vista previa. Guarda para aplicarla.')}catch(e){notice('No se pudo procesar la imagen')}}
