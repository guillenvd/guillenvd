function menuTabs(){return `<div class="toolbar menu-filter">${[['all','Todos'],['bebida','Bebidas'],['granos','Granos'],['pan','Panadería'],['otro','Otros']].map(([v,l])=>`<button class="tab ${s.menuCategory===v?'active':''}" data-action="menuFilter:${v}">${l}</button>`).join('')}</div>`}
function pageMenuBusiness(){
 const shared=s.menuMode==='brand',id=s.scope==='all'?'bruma1':s.scope,items=menuCatalog(id).filter(x=>s.menuCategory==='all'||x.category===s.menuCategory);
 const intro=`${head('BRUMA CAFÉ · CATÁLOGO','Menú y café.','Gestiona bebidas, panadería, granos, métodos de extracción y disponibilidad por ubicación.',btn('+ Añadir producto','newMenu','primary',!shared&&s.scope==='all'?'disabled':''))}<section class="card catalog-mode"><div><div class="eyebrow">ESTRUCTURA DEL MENÚ</div><h3>¿Un menú para toda la marca o distinto por sede?</h3><p>El catálogo de marca se comparte; puedes desactivar productos que una sede no ofrece. Los menús por sede se editan independientemente.</p></div><div class="mode-buttons"><button class="mode-card ${shared?'selected':''}" data-action="menuMode:brand" aria-pressed="${shared}"><span class="mode-emoji">◎</span><b>Menú general</b><small>Un catálogo · disponibilidad por sede</small></button><button class="mode-card ${!shared?'selected':''}" data-action="menuMode:branch" aria-pressed="${!shared}"><span class="mode-emoji">▦</span><b>Menú por sucursal</b><small>Productos y precios propios</small></button></div></section>`;
 if(!shared&&s.scope==='all')return `${intro}<div class="banner" style="margin-bottom:18px">Selecciona una sucursal para editar sus productos. Los menús de Hipódromo y Zona Río se guardan por separado.</div><div class="grid two">${branches.map(branchMenuPreview).join('')}</div>`;
 return `${intro}${shared?`<div class="banner" style="margin-bottom:18px">Los cambios de nombre, precio y descripción afectan a ambas sucursales. La disponibilidad se decide individualmente con las casillas debajo de cada producto.</div>`:`<div class="banner" style="margin-bottom:18px">Editando exclusivamente ${esc(place(id).branch)}. Los cambios no afectan a otras sucursales.</div>`}${menuTabs()}<div class="row" style="margin:0 0 16px"><h3>Catálogo ${shared?'de marca':'· '+esc(place(id).area)}</h3>${t(`${items.length} productos`,'neutral')}</div><div class="menu-panel">${items.map(x=>menuItemHTML(x,{manage:true,scope:id})).join('')||'<div class="empty">No hay productos en esta categoría.</div>'}</div><div class="section-head"><h2>Vista del cliente por sede</h2></div><div class="grid two">${(shared?branches:[id]).map(branchMenuPreview).join('')}</div>`
}
function menuPublicHTML(id){const menu=menuAt(id);if(!menu.length)return '<p>No hay productos publicados en esta sede.</p>';const grouped=['bebida','granos','pan','otro'];return `<div class="menu-methods" style="margin-bottom:12px">${[...new Set(menu.flatMap(itemMethods))].map(x=>t(x,'neutral')).join('')}</div>${grouped.map(k=>{const rows=menu.filter(x=>x.category===k);return rows.length?`<div class="menu-public-section"><h3>${MENU_CATEGORIES[k][0]} ${MENU_CATEGORIES[k][1]}</h3>${rows.map(x=>menuItemHTML(x)).join('')}</div>`:''}).join('')}<p class="slim muted">Menú ficticio para prototipo. Disponibilidad y precios ilustrativos, confirmarlos con la cafetería.</p>`}
function startMenuEditor(itemId){const id=s.scope==='all'?'bruma1':s.scope;if(s.menuMode==='branch'&&s.scope==='all')return notice('Selecciona la sede para editar su menú');const existing=menuCatalog(id).find(x=>x.id===itemId);s.form=existing?{...existing,methods:(existing.methods||[]).join(', '),locations:[...(existing.locations||[])]}:{name:'',category:'bebida',description:'',price:'',currency:'MXN',status:'published',methods:'Espresso',beanName:'',origin:'',varietal:'',process:'',roast:'',notes:'',locations:sharedMenuLocations()};s.modal='menuEditor';render()}
function sharedMenuLocations(){return s.scope==='all'?branches.slice():[s.scope]}
function menuEditorBody(){const f=s.form||{};return `<div class="stack"><div class="banner">${s.menuMode==='brand'?'Editas el menú de marca. La disponibilidad por sede se ajusta después desde el catálogo.':'Editas únicamente '+esc(place(s.scope)?.branch||'la sucursal seleccionada')}. Datos locales de ejemplo.</div><div class="form-grid">${field('name','Nombre del producto','text',f.name||'',true,'maxlength="65"')}${selectField('category','Categoría',Object.entries(MENU_CATEGORIES).map(([key,values])=>[key,values[1]]),f.category||'bebida')}${field('price','Precio','number',f.price||'',true,'min="0" step="0.01"')}${selectField('currency','Moneda',[['MXN','MXN'],['USD','USD']],f.currency||'MXN')}<div class="span2">${textField('description','Descripción del producto',f.description||'',false)}</div><div class="span2">${field('methods','Métodos disponibles (separados por coma)','text',f.methods||'',false,'placeholder="Espresso, V60, Aeropress"')}</div><div class="span2">${field('beanName','Grano utilizado (para bebidas)','text',f.beanName||'',false,'placeholder="Blend de la casa"')}</div>${field('origin','Origen del café','text',f.origin||'',false,'placeholder="Chiapas, México"')}${field('varietal','Varietal','text',f.varietal||'',false,'placeholder="Bourbon"')}${field('process','Proceso','text',f.process||'',false,'placeholder="Lavado / Natural"')}${selectField('roast','Tueste',[['','No especificado'],['Claro','Claro'],['Medio','Medio'],['Oscuro','Oscuro']],f.roast||'')}<div class="span2">${field('notes','Notas de sabor','text',f.notes||'',false,'placeholder="Cacao, panela, cítricos"')}</div>${selectField('status','Visibilidad',[['published','Publicado'],['draft','Borrador']],f.status||'published')}</div><div class="modal-footer">${btn('Cancelar','close','secondary')}${btn('Guardar producto','saveMenu','primary')}</div></div>`}

function notice(str){s.toast=str;render();setTimeout(()=>{if(s.toast===str){s.toast='';const el=document.getElementById('toast');if(el)el.remove()}},3800)}
function nav(page){s.page=page;s.modal=null;s.form=null;persist();render();window.scrollTo({top:0,behavior:'instant'})}
function switchSpace(space){s.space=space;s.page=sections[space][0][0];s.modal=null;s.form=null;persist();render();window.scrollTo({top:0,behavior:'instant'});notice(space==='personal'?'Espacio personal activo':space==='business'?'Modo negocio de ejemplo: Bruma Café':'Modo editorial de ejemplo (superadmin)')}
function badgeSpace(){return s.space==='business'?'Bruma Café · demo':s.space==='admin'?'Superadmin · demo':'Personal · demo'}
function shell(){let navs=sections[s.space];return `<div class="app"><aside class="rail"><div class="brand"><div class="mark">r</div><div><span class="brand-name">rondaza</span><small>V17.2 · BUSINESS STUDIO</small></div></div><div class="side-section">${s.space==='personal'?'TU PRÓXIMA SALIDA':s.space==='business'?'GESTIÓN DE NEGOCIO':'OPERACIÓN EDITORIAL'}</div>${navs.map(n=>navBtn(n)).join('')}<div class="rail-foot"><div class="scope-chip">◉ ${esc(badgeSpace())}</div><br/><span class="version-chip">v17.2 · copia independiente</span><p class="slim muted">Datos simulados y guardados solo en este navegador.</p>${s.space!=='personal'?`<button class="quiet" data-action="switch:personal">← Volver a persona</button>`:''}</div></aside><main class="workspace"><header class="topbar"><div><span class="eyebrow" style="margin:0">SAN DIEGO + TIJUANA</span><strong>${esc(navs.find(n=>n[0]===s.page)?.[1]||'Rondaza')}</strong></div><div class="top-actions"><span class="label-pill">◌ Datos de ejemplo</span>${s.space==='business'?scopePicker():''}<button class="avatar" aria-label="Cambiar de espacio" data-action="spaces">DG</button></div></header><header class="mobile-top"><div class="brand"><div class="mark">r</div><span class="brand-name">rondaza</span></div><div class="top-actions"><span class="version-chip" style="margin:0">v17.2</span><button class="avatar" data-action="spaces" aria-label="Espacios">DG</button></div></header>${s.space==='business'?`<div class="mobile-business-scope">${scopePicker()}</div>`:''}<div class="content">${renderPage()}</div></main><nav class="mobile-nav" aria-label="Navegación principal">${navs.slice(0,5).map(n=>`<button data-action="nav:${n[0]}" class="${s.page===n[0]?'active':''}">${icon(n[2])}<span>${esc(n[1])}</span></button>`).join('')}</nav>${s.modal?modal():''}${s.toast?`<div class="toast" role="status" id="toast">${esc(s.toast)}</div>`:''}</div>`}
function navBtn(n){return `<button class="navlink ${s.page===n[0]?'active':''}" data-action="nav:${n[0]}">${icon(n[2])}<span>${esc(n[1])}</span></button>`}
function scopePicker(){return `<select class="selector" data-change="scope" aria-label="Seleccionar sucursal"><option value="all" ${s.scope==='all'?'selected':''}>Todas mis sucursales</option><option value="bruma1" ${s.scope==='bruma1'?'selected':''}>Bruma · Hipódromo</option><option value="bruma2" ${s.scope==='bruma2'?'selected':''}>Bruma · Zona Río</option></select>`}
const head=(upper,title,desc,actions='')=>`<div class="page-head"><div><div class="eyebrow">${upper}</div><h1 class="h1">${title}</h1><p class="lead">${desc}</p></div><div class="inline-actions">${actions}</div></div>`;
function placeCard(p){const saved=s.saved.includes(p.id);return `<article class="card"><div class="feature-visual ${p.v}">${p.emoji}<span class="visual-label">DEMO · ${esc(p.area)}</span></div><div class="row"><div><h3>${esc(p.name)}</h3><div class="meta">${esc(p.city)} · ${esc(p.type)}</div></div>${t('Ejemplo','amber')}</div><p>${esc(p.description)}<br/><b>Qué pedir:</b> ${esc(p.product)}</p><div class="inline-actions">${btn('Ver ficha','place:'+p.id,'secondary small')}${btn(saved?'✓ Guardado':'Guardar','save:'+p.id,'ghost small')}${btn('+ Ruta','routeadd:'+p.id,'ghost small')}</div></article>`}
function pageInicio(){return `${head('TU COMUNIDAD','Tu ronda.','Las buenas recomendaciones se vuelven planes.',btn('+ Compartir visita','visit','primary'))}<section class="hero"><div><div class="eyebrow" style="color:#ecd7c9">ES MOMENTO DE SALIR</div><h2>Un café se disfruta mejor cuando se comparte.</h2><p class="lead">Encuentra algo nuevo, guarda tus favoritos y prepara la ruta del fin de semana.</p>${btn('Explorar cafeterías →','nav:explorar')}</div></section><div class="section-head"><h2>Lo que pasa en tu ronda</h2><button class="quiet" data-action="nav:explorar">Descubrir lugares →</button></div><div class="grid two"><div class="stack">${s.visits.slice().reverse().map(v=>feedItem('DG',v.text,place(v.placeId)?.branch||'Cafetería',v.date)).join('')}${feedItem('AM','Volví por el latte de la casa y terminé quedándome toda la tarde en el patio. ☕','Casa Nube · San Diego','Hace 2 h','Ana M.')}${feedItem('JL','El croissant de almendra salió tibio. Esta parada merece entrar en la ruta del sábado.','Miga Local · Tijuana','Ayer','Julián L.')}</div><div class="stack"><div class="card"><div class="row"><h3>Próximo evento</h3>${t('Agenda de ejemplo','amber')}</div><div class="feature-visual visual-event" style="height:120px;font-size:54px">🗓️</div><h3>Encuentro de café y pan</h3><p>24 oct · Tijuana · actividad ficticia para validar el flujo.</p>${btn('Ver agenda →','nav:eventos-personal','secondary full')}</div><div class="card"><h3>Tu siguiente ruta</h3><p>Ya guardaste ${s.route.length} parada(s). Añade más lugares o comparte un recorrido.</p>${btn('Abrir mis rutas →','nav:rutas','secondary full')}</div><div class="card home-loyalty"><div class="row"><h3>Tu tarjeta de café</h3>${t('Club','neutral')}</div>${stampCard('bruma1')}<div class="inline-actions" style="margin-top:16px">${btn('Mis tarjetas →','clubs-personal','ghost full')}</div></div></div></div>`}
function feedItem(initials,body,where,date,who='Tú'){return `<article class="card"><div class="feed-row"><span class="initial ${initials==='DG'?'green':''}">${esc(initials)}</span><div class="feed-body"><b style="font-size:13px">${esc(who)}</b><div class="meta">${esc(date)} · ${esc(where)}</div><p>${esc(body)}</p><div class="inline-actions"><button class="quiet" data-action="nav:explorar">Explorar el lugar →</button></div></div></div></article>`}
function pageExplorar(){const filtered=places.filter(p=>(p.name+' '+p.area+' '+p.city+' '+p.type+' '+p.product).toLowerCase().includes(s.placeSearch.toLowerCase()));return `${head('DESCUBRE','Tu próximo café.','Cafeterías, panaderías y tostadores. Busca un lugar concreto, no solo una marca.',btn('Ver eventos →','nav:eventos-personal','secondary'))}<div class="banner">ⓘ Estos locales, nombres, fotos y horarios son ilustrativos. La ficha de producción requerirá datos verificados por sucursal.</div><div class="toolbar" style="margin-top:18px"><input class="search" data-input="placeSearch" placeholder="Buscar por café, producto, ciudad o zona" value="${esc(s.placeSearch)}" aria-label="Buscar lugares" />${btn('Agenda de café →','nav:eventos-personal','ghost')}</div><div class="grid">${filtered.map(placeCard).join('')||'<div class="empty">No hay coincidencias con los datos de muestra.</div>'}</div>`}
function pageGuardados(){return `${head('TUS LUGARES','Guardados.','Una lista de lugares que quieres conocer, independiente de tus rutas.')}${s.saved.length?`<div class="grid">${s.saved.map(id=>place(id)).filter(Boolean).map(placeCard).join('')}</div>`:'<div class="empty"><h3>Sin lugares guardados</h3><p>Explora cafeterías y guarda las que quieras visitar.</p>'+btn('Explorar','nav:explorar')+'</div>'}`}
function pageRutas(){const lines=s.route.map((id,i)=>{const p=place(id);return p?`<div class="row" style="padding:14px 0;border-bottom:1px solid var(--line)"><div class="row" style="justify-content:start"><span class="initial">${i+1}</span><div><b>${esc(p.branch)}</b><div class="meta">${esc(p.city)} · ${esc(p.area)}</div></div></div><div class="inline-actions">${btn('↑','up:'+i,'ghost small',i===0?'disabled':'')}${btn('↓','down:'+i,'ghost small',i===s.route.length-1?'disabled':'')}${btn('Quitar','remove:'+id,'secondary small')}</div></div>`:''}).join('');return `${head('PLANEA UNA SALIDA','Mis rutas.','El itinerario pertenece al creador. Los invitados solo pueden proponer cambios.',btn('+ Crear ruta','newroute'))}<div class="grid two"><div class="card"><div class="row"><h3>${esc(s.routeName)}</h3>${t(s.routeShared?'Compartida':'Privada',s.routeShared?'':'amber')}</div><p>2 a 5 paradas para compartir una ruta completa. Puedes reordenarlas.</p>${lines||'<p>Empieza añadiendo un lugar desde Explorar.</p>'}<div class="inline-actions" style="margin-top:20px">${btn('+ Agregar parada','nav:explorar','secondary')}${btn('Compartir ruta','share-route','primary',s.route.length<2?'disabled':'')}</div></div><div class="stack"><div class="card"><h3>Vista del itinerario</h3><div class="placeholder-map"><span class="map-marker" style="top:16%;left:18%">1</span><span class="map-marker" style="top:52%;left:58%">2</span><span class="map-marker" style="top:77%;left:32%">3</span><span class="map-footnote">Mapa ilustrativo · sin ETA real</span></div><p>No se calculan trayectos ni tiempos fronterizos en esta demo.</p></div><div class="card"><div class="row"><h3>Sugerencias pendientes</h3>${t(String(s.routeSuggestions.filter(x=>x.status==='pending').length),'neutral')}</div>${s.routeSuggestions.length?s.routeSuggestions.map((x,i)=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><div class="row"><b>${esc(place(x.place)?.branch||'Lugar')}</b>${t(x.status,x.status==='pending'?'amber':'neutral')}</div><p>${esc(x.note)}</p>${x.status==='pending'?`<div class="inline-actions">${btn('Aceptar','acceptSuggestion:'+i,'ghost small')}${btn('Descartar','rejectSuggestion:'+i,'secondary small')}</div>`:''}</div>`).join(''):'<p>Todavía no hay propuestas de paradas.</p>'}${btn('Simular sugerencia de un amigo','suggest-route','secondary full')}</div></div></div>`}
function pageCuenta(){return `${head('TU PERFIL','Tu espacio.','Una identidad para disfrutar Rondaza y, si tienes permisos, gestionar negocios.') }<div class="grid two"><div class="card"><div class="feed-row"><span class="initial green">DG</span><div><h3>Tu perfil</h3><p>Cuenta demostrativa · Español</p></div></div><div class="hr"></div><h3>Funciones personales</h3><div class="stack">${btn('Mis clubes y recompensas →','clubs-personal','secondary full')}${btn('Mis rutas →','nav:rutas','secondary full')}${btn('Mis guardados →','nav:guardados','secondary full')}</div></div><div class="card"><h3>Cambiar de espacio</h3><p>Un mismo perfil puede operar varias sucursales. Las vistas de negocio y administración tienen permisos distintos.</p>${spaceCards()}<p class="slim muted">Los permisos en v17.2 son simulados: cambiar de espacio no constituye autorización real.</p></div></div>`}
function spaceCards(){return `<div class="stack"><button class="radio-choice ${s.space==='personal'?'active':''}" data-action="switch:personal"><span>👤</span><span><b>Personal</b><br/><small class="muted">Descubrir, rutas, visitas y clubes</small></span></button><button class="radio-choice ${s.space==='business'?'active':''}" data-action="switch:business"><span>🏪</span><span><b>Bruma Café · Gerente demo</b><br/><small class="muted">Hipódromo y Zona Río autorizadas</small></span></button><button class="radio-choice ${s.space==='admin'?'active':''}" data-action="switch:admin"><span>🛡️</span><span><b>Rondaza · Editorial demo</b><br/><small class="muted">Superadministración simulada</small></span></button></div>`}
function pageEventsPersonal(){const evs=s.events.filter(e=>e.kind==='public'&&['published','cancelled','postponed'].includes(e.status));return `${head('AGENDA DE CAFÉ','Eventos.','Descubre experiencias publicadas por Rondaza. Las propuestas todavía no aprobadas son privadas.',btn('+ Proponer evento','event-public'))}<div class="toolbar"><button class="tab ${s.cityFilter==='Todos'?'active':''}" data-action="city:Todos">Todas</button><button class="tab ${s.cityFilter==='Tijuana'?'active':''}" data-action="city:Tijuana">Tijuana</button><button class="tab ${s.cityFilter==='San Diego'?'active':''}" data-action="city:San Diego">San Diego</button></div><div class="grid">${evs.filter(x=>s.cityFilter==='Todos'||x.city===s.cityFilter).map(eventCard).join('')||'<div class="empty">No hay eventos con estos filtros.</div>'}</div><div class="section-head"><h2>¿Conoces un encuentro?</h2></div><div class="card"><p>Cualquier persona puede enviar una propuesta. Solo el equipo editorial puede publicarla en la agenda.</p>${btn('Enviar una propuesta →','event-public')}</div>`}
function eventCard(e){return `<article class="card"><div class="feature-visual visual-event">🗓️<span class="visual-label">AGENDA · ${esc(e.city)}</span></div><div class="row"><h3>${esc(e.title)}</h3>${t(e.status==='published'?'Publicado':e.status,e.status==='published'?'':'rose')}</div><p><b>${esc(dateLabel(e.date))} · ${esc(e.time)}</b> (${esc(e.tz)})<br/>${esc(e.location)}</p><p>${esc(e.description||'')}</p><p class="slim muted">Fuente: ${esc(e.source||'Sin fuente verificada')}</p>${btn('Ver detalles →','eventDetail:'+e.id,'secondary full')}</article>`}

function businessPosts(){const relevant=s.businessPosts.filter(p=>s.scope==='all'||p.locations.includes(s.scope));return `${head('BRUMA CAFÉ','Publicaciones.','Una publicación puede aparecer en varias sucursales, pero conserva un solo ID.',btn('+ Publicar novedad','businessPost'))}<div class="banner">La opción “Todas” comprende únicamente las dos sucursales autorizadas en esta demo. No otorga acceso a otras franquicias.</div><div class="section-head"><h2>Publicaciones del negocio</h2><div class="scope-chip">${s.scope==='all'?'Todas mis sucursales':esc(place(s.scope)?.branch)}</div></div><div class="stack">${relevant.map(p=>`<article class="card"><div class="row"><b>Bruma Café</b>${t('Orgánico')}</div><p style="font-size:15px;color:var(--dark)">${esc(p.text)}</p><div class="meta">${esc(p.locations.map(x=>place(x)?.area||x).join(' · '))} · ID ${esc(p.id)}</div><div class="hr"></div><div class="inline-actions">${btn('Ver alcance','postDetail:'+p.id,'secondary small')}${btn('Compartir enlace','sharePost:'+p.id,'ghost small')}</div></article>`).join('')||'<div class="empty">Sin publicaciones en esta sucursal.</div>'}</div>`}

const THEMES={espresso:{name:'Cacao & cream',bg:'#4a2d27',ink:'#fff8ed'},sage:{name:'Sage atelier',bg:'#264b42',ink:'#fff7e7'},clay:{name:'Terracotta',bg:'#9b4f3d',ink:'#fff8ef'},midnight:{name:'Midnight roast',bg:'#1d242b',ink:'#f6eee4'},oat:{name:'Oat milk',bg:'#e7d5bd',ink:'#342c26'}};

function localeDay(){const parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/Tijuana',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const get=t=>parts.find(x=>x.type===t)?.value||'00';return `${get('year')}-${get('month')}-${get('day')}`}

function safeCover(url){return typeof url==='string'&&/^data:image\/(?:jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(url)?url:''}
function stampCard(id,opts={}){const pr=opts.program||effectiveProgram(id),p=place(id),theme=THEMES[pr.cardStyle]||THEMES.espresso,accent=/^#[0-9a-fA-F]{6}$/.test(pr.accent||'')?pr.accent:'#dfbd90',a=opts.preview?Math.min(Number(pr.target)||6,3):joinedClub(id)?stampCount(id):0,target=Math.min(20,Math.max(2,Number(pr.target)||6)),ratio=Math.min(a,target),glyph=GLYPHS[pr.stampGlyph]||GLYPHS.coffee,cover=safeCover(pr.cover),logo=safeCover(pr.logo),shared=sharedClub();return `<div class="loyalty-card ${target>12?'dense':''} theme-${esc(pr.cardStyle||'espresso')}" role="img" aria-label="Tarjeta ${shared?'compartida en dos sedes':'de '+p.branch}: ${a} de ${target} sellos" style="--card-accent:${accent};--card-bg:${theme.bg};--card-ink:${theme.ink};${cover?`--cover-image:url('${cover}');`:''}"><div class="loyalty-gloss"></div><div class="loyalty-orb"></div><div class="loyalty-front"><div class="loyalty-top"><span class="loyalty-brandmark">${logo?`<img src="${logo}" alt=""/>`:esc(p.name.charAt(0).toUpperCase())}</span><div class="loyalty-brand"><span>${esc(pr.cardTitle||p.name)}</span><small>${esc(pr.tagline||'YOUR COFFEE, YOUR RITUAL')}</small></div><span class="loyalty-rondaza">rondaza<span>®</span></span></div><div class="loyalty-mid"><div class="loyalty-label">${shared?'DOS SEDES • UNA SOLA TARJETA':'MEMBERSHIP • '+esc(p.area.toUpperCase())}</div><div class="loyalty-claim">${esc(pr.reward)}</div></div><div class="loyalty-stamps" style="--stamp-columns:${target>12?7:target>8?6:target>6?5:target>4?target:Math.max(target,3)}">${Array.from({length:target},(_,i)=>`<span class="loyalty-stamp ${i<ratio?'earned':''}" title="${i<ratio?'Sello ganado':'Sello pendiente'}" aria-hidden="true">${i<ratio?'✓':esc(glyph)}</span>`).join('')}</div><div class="loyalty-bottom"><span>${opts.preview?'VISTA PREVIA':'MEMBER · DG 0001'}</span><span>${shared?'HIPÓDROMO + ZONA RÍO':'COFFEE CLUB'}</span></div></div></div>`}

function pageClubDesigner(){if(s.scope==='all'&&!sharedClub()){s.page='club';return pageClubBusiness()};const id=s.scope==='all'?'bruma1':s.scope,p=place(id),f=s.form||{...effectiveProgram(id)},shared=sharedClub();return `${head('ESTUDIO DE TARJETAS','Diseña tu club.',shared?'Configuración compartida: los cambios se verán en ambas sucursales autorizadas.':`Tarjeta propia para ${esc(p.branch)}.`,btn('← Volver al club','cancelClubDesigner','secondary'))}<div class="designer-layout"><div class="designer-preview"><p class="eyebrow">ASÍ LA VERÁ TU CLIENTE</p><div id="club-card-preview">${stampCard(id,{program:f,preview:true})}</div><div id="rules-live">${clubRules(f)}</div><div class="designer-hint">Los sellos visibles en la tarjeta muestran el progreso. La vista previa usa 3 sellos de ejemplo.</div><div class="designer-note"><b>Alcance: ${shared?'ambas sedes':'una sucursal'}</b><p>Los límites diarios del programa compartido aplican al total de visitas entre sedes. En producción: reglas versionadas y control de permisos.</p></div></div><div class="designer-settings"><section class="card studio-section"><div class="row"><h3>01 · Identidad visual</h3>${t(shared?'Marca compartida':'Sucursal','neutral')}</div><p>Personaliza la tarjeta con identidad propia de tu cafetería.</p>${field('cardTitle','Nombre visible en tarjeta','text',f.cardTitle||p.name,true,'maxlength="35"')}${field('tagline','Frase de la marca','text',f.tagline||'YOUR COFFEE CLUB',false,'maxlength="40"')}<div class="field-group"><label>Paleta base</label><div class="theme-swatches">${Object.entries(THEMES).map(([key,th])=>`<button type="button" class="theme-swatch ${f.cardStyle===key?'selected':''}" data-action="theme:${key}" title="${esc(th.name)}" aria-label="${esc(th.name)}" aria-pressed="${f.cardStyle===key}"><span style="background:${th.bg}"></span><small>${esc(th.name)}</small></button>`).join('')}</div></div><div class="designer-field-row"><div class="field-group"><label for="f-accent">Color de sellos</l function refreshClubDesigner(){if(s.space!=='business'||s.page!=='designer'||!s.form)return;const prev=document.getElementById('club-card-preview'),rules=document.getElementById('rules-live');if(prev)prev.innerHTML=stampCard(s.scope==='all'?'bruma1':s.scope,{program:s.form,preview:true});if(rules)rules.innerHTML=clubRules(s.form);document.querySelectorAll('.theme-swatch').forEach(el=>{let yes=el.dataset.action==='theme:'+s.form.cardStyle;el.classList.toggle('selected',yes);el.setAttribute('aria-pressed',String(yes))})}
async function handleImageUpload(input){const f=input.files?.[0],name=input.dataset.upload;if(!f||!['cover','logo'].includes(name))return;if(f.size>5*1024*1024||!['image/jpeg','image/png','image/webp'].includes(f.type))return notice('Sube un PNG, JPEG o WebP de hasta 5 MB');try{const url=URL.createObjectURL(f);const img=new Image();await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});const max=name==='logo'?320:1200,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);s.form[name]=canvas.toDataURL(name==='logo'?'image/png':'image/jpeg',.79);URL.revokeObjectURL(url);refreshClubDesigner();notice('Imagen lista para vista previa. Guarda para aplicarla.')}catch(e){notice('No se pudo procesar la imagen')}}

 else if(m.startsWith('qr:')){const sharedId=m.split(':')[1]==='shared',id=sharedId?'bruma1':m.split(':')[1],pr=effectiveProgram(id);title='Tu tarjeta digital';body=`<div class="qr-modal-card">${stampCard(id)}</div><div class="row" style="margin:16px 0"><div><b>${sharedId?'Bruma Café · Hipódromo y Zona Río':esc(place(id).branch)}</b><p class="slim muted">${esc(pr.description||'')}</p></div>${t(pr.status==='active'?'Activa':pr.status)}</div>${clubRules(pr)}<div class="qr" aria-label="Imagen QR ilustrativa, no válida">DEMO</div><p style="text-align:center" class="slim muted">QR ilustrativo; sin transacciones reales</p>`}

function ensureForm(){if(!s.form)s.form={}}
function handleAction(act){if(act==='close'||act==='overlay-close'){s.modal=null;s.form=null;render();return}
 if(act.startsWith('loyaltyMode:')){const mode=act.split(':')[1];if(!['branch','shared'].includes(mode)||mode===s.loyaltyMode)return;if(!window.confirm(mode==='shared'?'Cambiar a una tarjeta compartida? Se inicia un saldo compartido NUEVO en cero; los sellos por sede se conservan aparte, sin transferirse.':'Cambiar a tarjetas por sede? Se archivará la tarjeta compartida. Se restaurarán los saldos separados anteriores; no se fusionan sellos.'))return;s.loyaltyMode=mode;if(mode==='shared'){s.sharedEpoch=Number(s.sharedEpoch||0)+1;s.sharedStamps=0;s.sharedJoined=false;s.sharedProgram={...s.sharedProgram,status:'active'};}s.currentVisits={};s.page='club';s.form=null;persist();notice(mode==='shared'?'Tarjeta compartida nueva; saldos por sede conservados aparte':'Modo por sede restaurado; saldo compartido archivado');return}
 if(act.startsWith('menuMode:')){const mode=act.split(':')[1];if(!['brand','branch'].includes(mode)||mode===s.menuMode)return;if(!window.confirm('Cambiar la vista de menú? Ambos catálogos se conservan por separado, sin copiar ni sobrescribir productos. Verifica qué menú está activo.'))return;s.menuMode=mode;s.menuCategory='all';persist();notice(mode==='brand'?'Menú general activo':'Menús por sede activos');return}
 if(act.startsWith('menuFilter:')){s.menuCategory=act.split(':')[1];persist();render();return}
 if(act.startsWith('menuBranch:')){s.scope=act.split(':')[1];s.page='menu';persist();render();return}
 if(act==='newMenu'){startMenuEditor(null);return}
 if(act.startsWith('editMenu:')){startMenuEditor(act.slice(9));return}
 if(act.startsWith('deleteMenu:')){const id=act.slice(11);if(!window.confirm('Eliminar este producto del menú activo?'))return;const branch=s.scope==='all'?'bruma1':s.scope;if(s.menuMode==='brand')s.brandMenu=s.brandMenu.filter(x=>x.id!==id);else s.branchMenus[branch]=s.branchMenus[branch].filter(x=>x.id!==id);persist();notice('Producto eliminado del catálogo de demostración');return}
 if(act==='saveMenu'){const f=s.form;if(!f?.name?.trim())return notice('Escribe el nombre del producto');if(!Number.isFinite(Number(f.price))||f.price===''||Number(f.price)<0)return notice('Introduce un precio válido');if(!['bebida','granos','pan','otro'].includes(f.category))return notice('Selecciona una categoría');if(!['MXN','USD'].includes(f.currency))return notice('Selecciona una moneda');const id=s.scope==='all'?'bruma1':s.scope;if(s.menuMode==='branch'&&s.scope==='all')return notice('Selecciona una sede');const target=s.menuMode==='brand'?s.brandMenu:s.branchMenus[id];const existingIndex=target.findIndex(x=>x.id===f.id);const cleaned={...f,id:f.id||'menu-'+Date.now(),name:f.name.trim(),price:Number(f.price).toFixed(2),description:(f.description||'').trim(),beanName:(f.beanName||'').trim(),origin:(f.origin||'').trim(),varietal:(f.varietal||'').trim(),process:(f.process||'').trim(),roast:f.roast||'',notes:(f.notes||'').trim(),methods:String(f.methods||'').split(',').map(x=>x.trim()).filter(Boolean).slice(0,8),locations:s.menuMode==='brand'?(f.locations?.length?f.locations:sharedMenuLocations()):[id],status:f.status==='draft'?'draft':'published'};if(existingIndex>=0)target[existingIndex]=cleaned;else target.push(cleaned);s.modal=null;s.form=null;persist();notice('Producto guardado. '+(s.menuMode==='brand'?'Catálogo de marca':'Solo '+place(id).area));return}

if(act==='spaces'){s.modal='spaces';render();return}
if(act.startsWith('switch:')){switchSpace(act.slice(7));return}
if(act.startsWith('nav:')){let pg=act.slice(4);if(pg==='eventos-personal'||pg==='clubs-personal'){s.space='personal'}nav(pg);return}
if(act==='clubs-personal'){s.space='personal';nav('clubs-personal');return}
if(act.startsWith('city:')){s.cityFilter=act.slice(5);persist();render();return}

if(act.startsWith('save:')){let id=act.slice(5);s.saved=s.saved.includes(id)?s.saved.filter(x=>x!==id):[...s.saved,id];persist();notice(s.saved.includes(id)?'Lugar guardado':'Lugar retirado de guardados');return}

if(act==='event-public'){startEvent('public');return}
if(act==='event-business'){s.modal='eventKind';s.form=null;showEventKind();return}

if(act==='choose-public'){startEvent('public');return}
if(act==='eventBack'){s.step--;render();return}
if(act==='eventNext'){const f=s.form;if(s.step===0){if(!f.title?.trim()||!f.organizer?.trim()||!f.description?.trim()||!f.location?.trim()||(f.kind!=='private'&&!f.source?.trim()))return notice('Completa nombre, descripción, organizador, sede y fuente');if(f.kind==='private'&&!['bruma1','bruma2'].includes(f.branch))return notice('Selecciona una sucursal autorizada');}if(s.step===1){if(!f.date||!f.end||!f.time)return notice('Completa las fechas y la hora');if(f.end<f.date)return notice('La fecha final no puede ser anterior a la inicial')}s.step=Math.min(s.step+1,2);render();return}
if(act==='eventSubmit'){const f=s.form;const id='evt'+Date.now();const ev={id,kind:f.kind==='private'?'private':'public',title:f.title,description:f.description,organizer:f.organizer,source:f.source||'Invitación privada',city:f.city,location:f.location,date:f.date,end:f.end,time:f.time,tz:f.tz||'America/Tijuana',category:f.category,branch:f.branch,origin:s.space==='business'?'business':s.space==='personal'?'personal':'editorial',status:f.kind==='private'||f.kind==='editorial'?'draft':'proposed'};s.events.push(ev);s.modal=null;s.form=null;s.step=0;persist();notice(ev.status==='proposed'?'Propuesta enviada a revisión (demo)':ev.kind==='private'?'Encuentro privado guardado':'Borrador editorial guardado');return}
if(act.startsWith('eventDetail:')){s.modal=act;render();return}
if(act.startsWith('approve:')){if(s.space!=='admin')return notice('Sólo superadmin puede publicar');const e=s.events.find(x=>x.id===act.slice(8));if(e&&e.kind==='public'){e.status='published';s.modal=null;persist();notice('Evento publicado en agenda (demo)')}return}
if(act.startsWith('rejectEvent:')){if(s.space!=='admin')return notice('Permiso insuficiente');const e=s.events.find(x=>x.id===act.slice(12));if(e){e.status='rejected';s.modal=null;persist();notice('Propuesta rechazada')}return}
if(act.startsWith('cancelEvent:')){if(s.space!=='admin')return notice('Permiso insuficiente');const e=s.events.find(x=>x.id===act.slice(12));if(e){e.status='cancelled';s.modal=null;persist();notice('Evento cancelado; su ficha se conserva')}return}
if(act.startsWith('invite:')){const e=s.events.find(x=>x.id===act.slice(7));if(e&&e.kind==='private'){e.status='invited';s.modal=null;persist();notice('Invitaciones simuladas. No se enviaron mensajes.')}return}
if(act==='businessPost'){s.form={text:'',locations:s.scope};s.modal='businessPost';render();return}
if(act==='submitPost'){if(!s.form.text?.trim())return notice('Escribe la publicación');const ids=s.form.locations==='all'?['bruma1','bruma2']:[s.form.locations];s.businessPosts.push({id:'p'+Date.now(),text:s.form.text,locations:ids,date:'Hoy'});s.modal=null;persist();notice('Publicación de prueba creada con un solo ID');return}
if(act.startsWith('postDetail:')){s.modal=act;render();return}
if(act.startsWith('sharePost:'))return notice('Enlace externo no disponible sin backend; nada se ha compartido')
if(act.startsWith('setScope:')){s.scope=act.slice(9);s.page='club';persist();render();return}
if(act.startsWith('theme:')){if(s.page==='designer'&&s.form){const v=act.slice(6);if(THEMES[v]){s.form.cardStyle=v;refreshClubDesigner()}}return}
if(act.startsWith('clearImage:')){const k=act.slice(11);if(s.form&&['logo','cover'].includes(k)){s.form[k]='';refreshClubDesigner();notice('Imagen retirada de la vista previa; guarda los cambios.')}return}
if(act==='cancelClubDesigner'){s.page='club';s.form=null;render();return}
 if(act==='newVisit'){if(s.scope==='all')return notice('Selecciona una sucursal para registrar la visita');const id=s.scope,pr=effectiveProgram(id),log=branchLedger(id);if(pr.status!=='active'||log.total>=Number(pr.perDay||1))return notice('Límite diario alcanzado para este programa');s.currentVisits[visitKey(id)]={id:'visit-'+Date.now()+'-'+id,day:log.day};persist();notice('Nueva visita simulada en '+place(id).area);return}
 if(act==='configClub'){if(s.scope==='all'&&!sharedClub())return notice('Selecciona una sucursal');s.form={...effectiveProgram(s.scope==='all'?'bruma1':s.scope)};s.page='designer';s.modal=null;render();return}
 if(act==='submitClub'){const f=s.form||{},target=Number(f.target),perVisit=Number(f.perVisit),perDay=Number(f.perDay);if(!Number.isInteger(target)||target<2||target>20)return notice('La tarjeta debe tener entre 2 y 20 sellos');if(!Number.isInteger(perVisit)||perVisit<1||perVisit>10)return notice('Límite por visita entre 1 y 10');if(!Number.isInteger(perDay)||perDay<1||perDay>20||perVisit>perDay)return notice('El límite diario debe ser al menos el límite por visita (máximo 20)');if(!f.reward?.trim()||!f.cardTitle?.trim()||!f.description?.trim())return notice('Completa título, recompensa y condiciones');const targetObj=sharedClub()?s.sharedProgram:s.clubPrograms[s.scope];Object.assign(targetObj,{...f,target,perVisit,perDay,reward:f.reward.trim(),cardTitle:f.cardTitle.trim(),tagline:(f.tagline||'').trim(),description:f.description.trim()});s.form=null;s.page='club';persist();notice(sharedClub()?'Tarjeta compartida actualizada para ambas sedes':'Tarjeta actualizada para '+place(s.scope).area);return}
 if(act==='toggleClub'){if(s.scope==='all')return notice('Selecciona una sucursal');const pr=effectiveProgram(s.scope);pr.status=pr.status==='active'?'paused':'active';persist();notice('Estado del programa: '+pr.status);return}
 if(act==='addStamp'){if(s.scope==='all')return notice('Selecciona la sede de la compra');const id=s.scope,pr=effectiveProgram(id),limitV=Number(pr.perVisit)||1,limitD=Number(pr.perDay)||1;if(!joinedClub(id))return notice('El cliente de ejemplo no está inscrito');if(pr.status!=='active')return notice('Este programa está pausado');let log=branchLedger(id);if(log.total>=limitD)return notice('Límite diario del programa alcanzado: '+limitD);if(log.visit&&log.perVisit>=limitV)return notice('Límite por visita alcanzado: '+limitV);if(!log.visit){s.currentVisits[visitKey(id)]={id:'visit-'+Date.now()+'-'+id,day:log.day};log=branchLedger(id)}s.stampEvents.push({id:'stamp-'+Date.now()+'-'+s.stampEvents.length,programId:activeStampProgram(id),branch:id,day:log.day,visitId:s.currentVisits[visitKey(id)].id,count:1});if(sharedClub())s.sharedStamps=(s.sharedStamps||0)+1;else s.stamps[id]=(s.stamps[id]||0)+1;persist();notice('Sello de '+place(id).area+' registrado. '+branchLedger(id).total+'/'+limitD+' hoy en el programa.');return}
 if(act==='redeem'){const id=s.scope,pr=effectiveProgram(id);if(!branches.includes(id))return notice('Selecciona una sucursal');if(pr.status!=='active'||stampCount(id)<pr.target)return notice('Recompensa no disponible');if(sharedClub())s.sharedStamps-=pr.target;else s.stamps[id]-=pr.target;const key=activeStampProgram(id);s.redeemed[key]=(s.redeemed[key]||0)+1;persist();notice('Canje de demostración en '+place(id).area+' registrado');return}
if(act.startsWith('qr:')||act.startsWith('consent:')){s.modal=act;render();return}
 if(act.startsWith('join:')){const id=act.slice(5),pr=effectiveProgram(id==='shared'?'bruma1':id);if(!pr||pr.status!=='active')return notice('Este programa no acepta inscripciones');s.form={id,marketing:false};s.modal='join';render();return}
 if(act==='confirmJoin'){const id=s.form.id;if(id==='shared'){s.sharedJoined=true}else{if(!s.joined.includes(id))s.joined.push(id);s.marketingConsent[id]=Boolean(s.form.marketing)}s.modal=null;persist();notice('Inscripción simulada guardada; la publicidad es opcional.');return}
if(act==='campaignPreview'){s.modal='campaignPreview';render();return}
if(act==='resetDemo'){if(window.confirm('¿Reiniciar todos los datos de demostración de v17.2 en este navegador?')){localStorage.removeItem(STORE);window.location.reload()}return}
}
function showEventKind(){s.modal='chooseKind';render()}
const oldModal=modal;modal=function(){if(s.modal==='chooseKind')return `<div class="modal-overlay" data-action="overlay-close"><section class="modal" role="dialog" aria-modal="true" aria-label="Tipo de evento"><div class="modal-header"><h2>¿Qué tipo de evento quieres crear?</h2><button class="x" data-action="close" aria-label="Cerrar">×</button></div><p class="lead" style="margin-bottom:20px">La audiencia y los permisos cambian según el tipo de evento.</p><div class="stack"><button class="radio-choice" data-action="choose-private"><span style="font-size:26px">🔒</span><span><b>Encuentro privado de mi cafetería</b><br/><small class="muted">Invitados y RSVP, fuera de la agenda pública</small></span></button><button class="radio-choice" data-action="choose-public"><span style="font-size:26px">🗓️</span><span><b>Proponer a la agenda de Rondaza</b><br/><small class="muted">Se envía a revisión editorial; no se publica automáticamente</small></span></button></div></section></div>`;return oldModal()};
const app=document.getElementById('app');
app.addEventListener('click',e=>{const elem=e.target.closest('[data-action]');if(!elem)return;const act=elem.dataset.action;if(act==='overlay-close'&&e.target!==elem)return;e.preventDefault();handleAction(act)});
app.addEventListener('change',e=>{const el=e.target;if(el.dataset.menuLocation){const entry=s.brandMenu.find(x=>x.id===el.dataset.menuLocation),branch=el.dataset.branch;if(entry&&branches.includes(branch)){entry.locations=el.checked?[...new Set([...(entry.locations||[]),branch])].sort():(entry.locations||[]).filter(x=>x!==branch);persist();notice('Disponibilidad actualizada para '+place(branch).area)}return}if(el.dataset.change==='scope'){s.scope=el.value;persist();render()}else if(el.dataset.change?.startsWith('consent:')){const id=el.dataset.change.slice(8);s.marketingConsent[id]=Boolean(el.checked);persist();notice('Preferencia guardada en este navegador')}else if(el.dataset.change==='joinMarketing'){ensureForm();s.form.marketing=Boolean(el.checked)}else if(el.dataset.form){ensureForm();s.form[el.dataset.form]=el.value;refreshClubDesigner()}else if(el.dataset.upload){handleImageUpload(el)}});
app.addEventListener('input',e=>{const el=e.target;if(el.dataset.form){ensureForm();s.form[el.dataset.form]=el.value;refreshClubDesigner()}else if(el.dataset.input==='placeSearch'){s.placeSearch=el.value;let focus=el.selectionStart;render();let newel=app.querySelector('[data-input="placeSearch"]');newel?.focus();newel?.setSelectionRange(focus,focus)}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&s.modal){s.modal=null;render()}});
render();
})();

</script>
</body>
