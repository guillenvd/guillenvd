/* =============================================================
   RONDAZA v19 — Warm Editorial / White-first design system
   Main surfaces: ivory and white. Terracotta is an intentional
   interaction accent; greens reserved for confirmed/success.
   ============================================================= */
:root {
  color-scheme: light;
  font-family: "DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --dark:#272421;
  --espresso:#402F29;
  --cream:#FDFBF8;
  --muted:#817972;
  --line:#ECE7E1;
  --soft:#F8F3ED;
  --pine:#C1694B;
  --rose:#D28C74;
  --radius:22px;
  --rondo-accent:#C1694B;
  --rondo-accent-hover:#A85339;
  --rondo-ink:#272421;
  --rondo-muted:#80766D;
  --rondo-paper:#FDFBF8;
  --rondo-ivory:#F5EAE0;
  --rondo-gold:#BF955F;
  --rondo-success:#347958;
}
html{background:var(--rondo-paper)}
body{background:var(--rondo-paper);color:var(--rondo-ink);font-family:"DM Sans",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
button{transition:background-color .18s ease,color .18s ease,box-shadow .18s ease,transform .18s ease}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #DFA58D;outline-offset:3px}
::selection{background:#F1D3C5;color:#4A2B24}

/* Consistent structural chrome */
.app{background:var(--rondo-paper)}
.rail{background:#fff;border-right:1px solid #EEE9E4;box-shadow:none;padding:33px 16px}
.workspace{background:var(--rondo-paper)}
.topbar{background:rgba(255,255,255,.96);border-bottom:1px solid #F1ECE7;backdrop-filter:blur(18px)}
.topbar .eyebrow{color:#B38B79}
.topbar strong{color:#3C332D}
.topbar .label-pill{background:#FAF5F0;border:1px solid #EEE4DD;color:#88766A}
.brand{gap:11px}
.mark{background:var(--rondo-ink);border-radius:15px;color:#F6EAE0;box-shadow:inset 0 -3px #FFFFFF15;font-family:"Fraunces",Georgia,serif;font-weight:620;font-size:30px}
.brand-name{font-family:"DM Sans",sans-serif;color:#282320;font-size:25px;letter-spacing:-1.55px;font-weight:800}
.brand small{color:#B4A69B;letter-spacing:1.5px}
.side-section{color:#B5A59A;letter-spacing:1.4px;font-weight:800}
.navlink{color:#746B64;border-radius:14px;font-weight:700}
.navlink svg{stroke-width:1.8}
.navlink.active{color:#A9553B;background:#FBEEE6;box-shadow:inset 3px 0 #C1694B}
.navlink:hover:not(.active){background:#FAF7F3;color:#49382F}
.rail-foot{border-color:#F0EBE6}
.rail-foot .scope-chip{border-color:#EDE6DF;background:#FAF7F4;color:#785B4A}
.version-chip{border-color:#EADCD1;background:#FBF1E9;color:#A25D42}
.avatar{background:#F3DED3;color:#A85D43;box-shadow:none}
.content{max-width:1480px;padding-top:42px}

/* Headings, photography, editorial storytelling */
.home-topline{margin-bottom:28px}
.home-topline h1,.explore-header h1{color:#272421;font-family:"DM Sans",sans-serif;font-weight:780;letter-spacing:-3.05px}
.home-topline h1 em,.explore-header h1 em{font-family:"Fraunces",Georgia,serif;font-style:italic;font-weight:525;color:#C27153;letter-spacing:-1.8px}
.home-topline p,.lead,.explore-header p{color:#817770}
.eyebrow{color:#B2745D;letter-spacing:1.9px;font-weight:850}
.live-dot{background:var(--rondo-gold)}
.icon-round{background:#272421;color:#fff;box-shadow:0 5px 16px #33241B23}
.icon-round:hover{background:#C1694B;transform:translateY(-2px)}
.h1{color:#292521;font-family:"DM Sans",sans-serif;font-size:clamp(35px,3.5vw,50px);font-weight:800;letter-spacing:-2.1px}
.h1 em{font-family:"Fraunces",Georgia,serif;font-style:italic;color:#BC7054}
.page-head{margin-bottom:30px}
.section-head h2,.home-section-heading h2,.explore-summary h2{color:#302B27;letter-spacing:-.85px;font-weight:780}
.home-section-heading>button,.explore-summary>button,.quiet{color:var(--rondo-accent)}

/* Warm dramatic lead image — no green tint */
.editorial-hero{
  background-color:#755343;
  background-image:linear-gradient(88deg,rgba(40,27,23,.91) 0%,rgba(62,39,30,.78) 43%,rgba(60,42,35,.05) 100%),var(--hero-photo),var(--hero-fallback)!important;
  border-radius:27px;min-height:362px;
  box-shadow:0 23px 52px #4A2C1C16;
}
.editorial-hero h2{font-family:"Fraunces",Georgia,serif;font-size:clamp(44px,4.8vw,66px);font-weight:510;line-height:1.04;letter-spacing:-2.3px}
.editorial-hero p{color:#F7E8E0}
.hero-chip{color:#FFE0CE;background:#FFF8F00F;border:1px solid #FFF4E65E;letter-spacing:1.2px}
.hero-discover{background:#FFFFFF;color:#312621;padding:14px 20px 14px 23px;box-shadow:0 3px 14px #00000015}
.hero-discover:hover{background:#FAE7DA;color:#8B402A}
.hero-footnote,.aside-photo-note{background:#2115108C;color:#F4EBE4}

/* Image-driven discovery tiles */
.home-section-heading h2{font-size:24px}
.shortcut-visual{border-radius:19px;box-shadow:0 8px 25px #59422C0D;background-color:#DFC2A8}
.shortcut-club{background:linear-gradient(145deg,#F5DEC4,#E8BDB0);color:#9B5339}
.discovery-shortcut b{color:#493A32;font-weight:750}
.home-social-heading button{border:1px solid #EADDD1;background:#fff;color:#9F583F}

/* Instagram-like posts: visual first, restrained dividers */
.social-post-v18{background:#fff;border:1px solid #F0EBE5;border-radius:25px;box-shadow:0 9px 35px #4630260B;padding:17px 17px 14px}
.social-post-v18 .social-author .initial{background:#F3D7C9;color:#8C4B34}
.social-post-v18 .social-author .initial.green{background:#F1E5CF;color:#815C3D}
.author-title b{color:#2A2522}
.social-post-v18 .meta{color:#A1948A}
.post-ellipsis{color:#9C8D84}
.post-photo{border-radius:19px;background-color:#CDB69C;background-image:linear-gradient(150deg,#3D261120,#27190C20),var(--spot-photo),var(--spot-fallback)!important}
.post-photo-note{background:#36271F99;color:#FFF5ED}
.post-location{background:rgba(33,25,21,.78);border-color:#FFFFFF48;color:#fff;box-shadow:0 4px 18px #211C1814}
.post-location small{color:#EFDED0}
.post-icon-btn{color:#473F39}

:root {

/* Rondaza UI primitives — v21.1
 * Pure HTML producers used by the existing event-delegated prototype.
 * All text arguments are escaped by default in the safe component API.
 * The legacy adapter surface is intentionally markup-compatible while features migrate.
 */
(function (root) {
  'use strict';
  const escapeHTML = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const escapeAttr = escapeHTML;
  const allowedTones = new Set(['neutral', 'amber', 'rose', 'success', 'warning', 'info']);
  const allowedButtonVariants = new Set(['primary', 'secondary', 'ghost', 'danger']);
  const joinClasses = (...tokens) => tokens.filter(Boolean).join(' ');

  function badge({ text, tone = 'neutral' }) {
    const safeTone = allowedTones.has(tone) ? tone : 'neutral';
    return `<span class="tag ${safeTone}">${escapeHTML(text)}</span>`;
  }
  function actionButton({ text, action, variant = 'secondary', size = 'default', full = false, disabled = false, ariaLabel = '' }) {
    const safeVariant = allowedButtonVariants.has(variant) ? variant : 'secondary';
    return `<button type="button" class="${joinClasses('button',safeVariant,size==='small'?'small':'',full?'full':'')}" data-action="${escapeAttr(action)}"${disabled?' disabled':''}${ariaLabel?` aria-label="${escapeAttr(ariaLabel)}"`:''}>${escapeHTML(text)}</button>`;
  }
  function pageHeader({ eyebrow = '', title, description = '', actionsHTML = '' }) {
    return `<div class="page-head"><div><div class="eyebrow">${escapeHTML(eyebrow)}</div><h1 class="h1">${escapeHTML(title)}</h1><p class="lead">${escapeHTML(description)}</p></div><div class="inline-actions">${actionsHTML}</div></div>`;
  }
  function input({ id, label, type = 'text', value = '', required = true, placeholder = '', disabled = false }) {
    const safeTypes = new Set(['text','number','email','url','date','time','tel','password','color']);
    const safeType = safeTypes.has(type) ? type : 'text';
    return `<div class="field-group"><label for="f-${escapeAttr(id)}">${escapeHTML(label)}${required?' *':''}</label><input class="field" id="f-${escapeAttr(id)}" data-form="${escapeAttr(id)}" type="${safeType}" value="${escapeAttr(value)}" ${required?'required':''}${placeholder?` placeholder="${escapeAttr(placeholder)}"`:''}${disabled?' disabled':''}/></div>`;
  }
  function select({ id, label, options, selected }) {
    return `<div class="field-group"><label for="f-${escapeAttr(id)}">${escapeHTML(label)}</label><select class="field" id="f-${escapeAttr(id)}" data-form="${escapeAttr(id)}">${options.map(([v,l])=>`<option value="${escapeAttr(v)}" ${v===selected?'selected':''}>${escapeHTML(l)}</option>`).join('')}</select></div>`;
  }
  function textarea({ id, label, value = '', required = true }) {
    return `<div class="field-group"><label for="f-${escapeAttr(id)}">${escapeHTML(label)}</label><textarea class="field" id="f-${escapeAttr(id)}" data-form="${escapeAttr(id)}" ${required?'required':''}>${escapeHTML(value)}</textarea></div>`;
  }
  // Legacy adapters preserve the raw trusted-markup escape hatch. Never pass user text
  // to `trustedLabelHTML`, `trustedTitleHTML`, `trustedDescriptionHTML`, or attributes.
  const legacyTag = (txt, type = 'neutral') => `<span class="tag ${escapeAttr(type)}">${escapeHTML(txt)}</span>`;
  const legacyButton = (trustedLabelHTML, act, cls = 'secondary', trustedAttrs = '') => `<button type="button" class="button ${escapeAttr(cls)}" data-action="${escapeAttr(act)}" ${trustedAttrs}>${trustedLabelHTML}</button>`;
  const legacyHeader = (trustedEyebrowHTML, trustedTitleHTML, trustedDescriptionHTML, trustedActionsHTML = '') => `<div class="page-head"><div><div class="eyebrow">${trustedEyebrowHTML}</div><h1 class="h1">${trustedTitleHTML}</h1><p class="lead">${trustedDescriptionHTML}</p></div><div class="inline-actions">${trustedActionsHTML}</div></div>`;
  const legacyField = (id,label,type='text',val='',required=true,extra='') => `<div class="field-group"><label for="f-${escapeAttr(id)}">${escapeHTML(label)}${required?' *':''}</label><input class="field" id="f-${escapeAttr(id)}" data-form="${escapeAttr(id)}" type="${escapeAttr(type)}" value="${escapeAttr(val)}" ${required?'required':''} ${extra}/></div>`;
  const legacySelectField = (id,label,options,selected) => select({id,label,options,selected});
  const legacyTextField = (id,label,val='',required=true) => textarea({id,label,value:val,required});

  root.RondazaUI = Object.freeze({escapeHTML,badge,actionButton,pageHeader,input,select,textarea,legacyTag,legacyButton,legacyHeader,legacyField,legacySelectField,legacyTextField});
})(window);

</script>
  <script>
/* Rondaza v21.2 — reusable branch-level remote-work presentation. */
(function(root){
'use strict';
const STATUS=['unknown','yes','no'], BOOL=['unknown','yes','no'], OUTLETS=['unknown','yes','some','no'], NOISE=['unknown','quiet','moderate','loud'], POLICY=['unknown','allowed','restricted','not-allowed'];
const choices={
 status:[['unknown','Sin información'],['yes','Sí, recomendado para trabajar'],['no','No es adecuado para trabajar']],
 wifi:[['unknown','No confirmado'],['yes','Disponible'],['no','No disponible']],
 outlets:[['unknown','No confirmado'],['yes','Sí, suficientes'],['some','Algunos enchufes'],['no','No disponibles']],
 noise:[['unknown','No confirmado'],['quiet','Tranquilo'],['moderate','Moderado'],['loud','Ambiente animado / ruidoso']],
 laptopPolicy:[['unknown','Sin información'],['allowed','Se permite laptop'],['restricted','Restricciones de horario o mesa'],['not-allowed','No se permite laptop']]
};
const defaults=Object.freeze({status:'unknown',wifi:'unknown',outlets:'unknown',noise:'unknown',laptopPolicy:'unknown',notes:'',source:'demo'});
function normalize(value){const data={...defaults,...(value&&typeof value==='object'?value:{})};for(const [field, allowed] of [['status',STATUS],['wifi',BOOL],['outlets',OUTLETS],['noise',NOISE],['laptopPolicy',POLICY]])if(!allowed.includes(data[field]))data[field]='unknown';data.notes=String(data.notes||'').slice(0,220);return data;}
function validate(value){const p=normalize(value);if(!STATUS.includes(value.status)||!BOOL.includes(value.wifi)||!OUTLETS.includes(value.outlets)||!NOISE.includes(value.noise)||!POLICY.includes(value.laptopPolicy)||String(value.notes||'').length>220)return null;return p;}
function label(field,key){return (choices[field].find(([id])=>id===key)||choices[field][0])[1];}
function source(p){return p.source==='business'?'Información aportada por el negocio':p.source==='editorial'?'Información de la ficha editorial':'Datos ilustrativos de demostración';}
function badge(raw,esc){const p=normalize(raw);return p.status==='yes'?'<span class="work-friendly-badge" aria-label="Apto para trabajar remoto">⌁ Para trabajar</span>':'';}
function summary(raw,esc){const p=normalize(raw);return `<div class="work-summary"><strong>${p.status==='yes'?'⌁ Apto para trabajo remoto':p.status==='no'?'Uso de laptop no recomendado':'Trabajo remoto: sin información'}</strong><small>${esc(p.status==='unknown'?'Configura las condiciones de la sede':source(p))}</small></div>`;}
function detail(raw,esc){const p=normalize(raw);const icon=p.status==='yes'?'⌁':p.status==='no'?'⊘':'ⓘ';const title=p.status==='yes'?'Buena opción para trabajar':p.status==='no'?'No recomendado para trabajar':'Trabajo remoto: aún sin confirmar';
 const parts=[['Wi-Fi',p.wifi==='unknown'?'Sin confirmar':label('wifi',p.wifi)],['Enchufes',label('outlets',p.outlets)],['Ambiente',label('noise',p.noise)],['Laptop',label('laptopPolicy',p.laptopPolicy)]];
 return `<div class="work-detail-header"><span class="work-detail-symbol">${icon}</span><div><h3>${title}</h3><p>Espacio, Wi-Fi y reglas para permanecer con laptop.</p></div></div><div class="work-amenities">${parts.map(([k,v])=>`<div><span>${esc(k)}</span><strong>${esc(v)}</strong></div>`).join('')}</div>${p.notes?`<p class="work-notes">${esc(p.notes)}</p>`:''}<p class="work-source">${esc(source(p))}. Las condiciones pueden cambiar: confírmalas con el local.</p>`;}
function editor(f,branch,esc,selectField,textField){const p=normalize(f);return `<div class="stack work-editor"><div class="work-editor-intro"><b>${esc(branch)}</b><p>La configuración es por sucursal, incluso si el negocio comparte menú o club. Marca «Sin información» si no está confirmado.</p></div><div class="form-grid"><div class="span2">${selectField('status','¿Es recomendable para trabajo remoto?',choices.status,p.status)}</div>${selectField('wifi','Wi-Fi',choices.wifi,p.wifi)}${selectField('outlets','Enchufes',choices.outlets,p.outlets)}${selectField('noise','Nivel de ruido',choices.noise,p.noise)}${selectField('laptopPolicy','Política de laptop',choices.laptopPolicy,p.laptopPolicy)}<div class="span2">${textField('notes','Condiciones, horarios o límites (máximo 220 caracteres)',p.notes,false)}</div></div><div class="banner">La recomendación es informativa y puede variar por horario. Esta versión no verifica Wi-Fi, enchufes ni políticas en el mundo real.</div></div>`;}
root.RondazaWork=Object.freeze({normalize,validate,badge,summary,detail,editor});
})(window);

</script>

// Locations are demo-supplied, never fabricated; edit rights depend on demo space.
const locationOf=id=>s.locationData?.[id]||{address:'',googlePlaceId:''};
const hasAddress=id=>(locationOf(id).address||'').trim().length>=8;
const googleId=id=>(locationOf(id).googlePlaceId||'').trim();
const mapTerm=id=>hasAddress(id)?locationOf(id).address.trim():'';
const googlePlaceURL=id=>{if(!hasAddress(id))return '';const q=new URLSearchParams({api:'1',query:mapTerm(id)});if(googleId(id))q.set('query_place_id',googleId(id));return 'https://www.google.com/maps/search/?'+q.toString()};
const applePlaceURL=id=>hasAddress(id)?'https://maps.apple.com/place?'+new URLSearchParams({address:mapTerm(id)}).toString():'';
function mapRouteURL(provider){const ids=s.route;if(!ids.length||ids.some(id=>!hasAddress(id)))return '';const stops=ids.map(mapTerm);if(provider==='google'){
 const q=new URLSearchParams({api:'1',destination:stops.at(-1),travelmode:s.mapTravelMode||'driving'});
 if(stops.length>=2)q.set('origin',stops[0]);
 if(stops.length>2)q.set('waypoints',stops.slice(1,-1).join('|'));
 return 'https://www.google.com/maps/dir/?'+q.toString();
}
 const q=new URLSearchParams({destination:stops.at(-1),mode:s.mapTravelMode||'driving'});
 if(stops.length>=2)q.set('source',stops[0]);
 stops.slice(1,-1).forEach(p=>q.append('waypoint',p));
 return 'https://maps.apple.com/directions?'+q.toString();
}
const googleShortlistURL=()=>{const ids=s.route.map(googleId);if(!ids.length||ids.some(id=>!id))return '';return 'https://www.google.com/maps/@?'+new URLSearchParams({api:'1',map_action:'shortlist',place_ids:ids.join(',')}).toString()};
function openVerifiedURL(url){if(!url||!/^https:\/\/(?:www\.google\.com\/maps\/|maps\.apple\.com\/)/.test(url))return notice('Completa las direcciones requeridas antes de abrir el mapa');const tab=window.open(url,'_blank','noopener,noreferrer');if(!tab)window.location.href=url;}
function locationActions(id){return hasAddress(id)?`<div class="inline-actions">${btn('↗ Google Maps','mapPlace:google:'+id,'ghost small')}${btn('↗ Apple Maps','mapPlace:apple:'+id,'ghost small')}</div>`:`<p class="slim muted">Dirección pendiente de registrar · no se mostrarán ubicaciones inventadas.</p>`}
function adminCanEditLocation(id){return s.space==='admin'||(s.space==='business'&&['bruma1','bruma2'].includes(id))}
function locationEditorStart(id){if(!place(id)||!adminCanEditLocation(id))return notice('Sin permiso de edición para esta ficha');s.form={placeId:id,address:locationOf(id).address||'',googlePlaceId:googleId(id)};s.modal='locationEditor';render()}
function locationEditor(){const f=s.form||{},p=place(f.placeId);return `<div class="stack"><p class="lead">${esc(p?.branch||'Sucursal')}</p>${field('address','Dirección completa (calle, número, ciudad, estado, país)','text',f.address||'',false,'maxlength="240" placeholder="Calle, número, colonia, ciudad, país"')}${field('googlePlaceId','Google Place ID (opcional, para crear listas)','text',f.googlePlaceId||'',false,'maxlength="250" placeholder="ChIJ..."')}<div class="banner">La ubicación se guarda solo en este navegador. Revisa que corresponda a la sede real; Rondaza no geocodifica ni verifica direcciones en esta demo. El ID es opcional para abrir mapas, pero necesario para exportar una lista Google.</div><div class="inline-actions">${btn('Guardar dirección','saveLocation','primary')}${btn('Cancelar','close','secondary')}</div></div>`}
function locationList(ids){return `<div class="grid two">${ids.map(id=>{const p=place(id),l=locationOf(id);return `<article class="card"><div class="row"><h3>${esc(p.branch)}</h3>${t(hasAddress(id)?'Dirección añadida':'Sin dirección',hasAddress(id)?'neutral':'amber')}</div><p class="slim">${esc(l.address||'Añade una dirección completa para activar navegación.')}</p>${l.googlePlaceId?`<p class="slim muted">Google Place ID configurado</p>`:''}<div class="work-location-row">${RondazaWork.summary(workOf(id),esc)}</div><div class="inline-actions">${btn('Condiciones para trabajar','editWork:'+id,'secondary small')}${btn('Editar dirección','editLocation:'+id,'secondary small')}${hasAddress(id)?btn('Ver en Google Maps','mapPlace:google:'+id,'ghost small'):''}</div></article>`}).join('')}</div>`}
function routeExportSection(){const missing=s.route.filter(id=>!hasAddress(id)),missingIDs=s.route.filter(id=>!googleId(id));return `<section class="card map-export"><div class="row"><div><div class="eyebrow">ABRIR EN MAPAS</div><h3>Tu plan, listo para navegar.</h3></div>${t((s.route.length||0)+' paradas','neutral')}</div><p>Rondaza organiza el plan. Abre una ruta de Google o Apple Maps con las paradas en el orden elegido.</p><div class="map-mode-picker"><label for="map-mode">Cómo viajar</label><select id="map-mode" class="selector" data-change="mapTravelMode"><option value="driving" ${s.mapTravelMode==='driving'?'selected':''}>En coche</option><option value="walking" ${s.mapTravelMode==='walking'?'selected':''}>Caminando</option></select></div><div class="export-buttons">${btn('↗ Ruta en Google Maps','exportRoute:google','primary',!s.route.length||missing.length?'disabled':'')}${btn('↗ Ruta en Apple Maps','exportRoute:apple','secondary',!s.route.length||missing.length?'disabled':'')}${btn('↗ Lista en Google Maps','exportGoogleList','secondary',!s.route.length||missingIDs.length?'disabled':'')}${btn('Copiar lugares','copyPlaces','ghost',!s.route.length?'disabled':'')}</div>${missing.length?`<div class="banner">Faltan direcciones: ${esc(missing.map(id=>place(id).branch).join(', '))}. ${s.space==='personal'?'Un negocio o el equipo editorial puede completarlas en el catálogo.':'Agrégalas desde Sucursales / Catálogo.'}</div>`:''}${missingIDs.length?`<p class="slim muted">Para la lista Google falta un Place ID de: ${esc(missingIDs.map(id=>place(id).branch).join(', '))}. La ruta normal no necesita estos IDs.</p>`:''}<p class="slim muted">No se crea una lista guardada automáticamente en tu cuenta. Google muestra una selección que puedes guardar allí. Apple Maps abre una ruta, no una Guía guardada.</p></section>`}


const sharedClub=()=>s.loyaltyMode==='shared';
const effectiveProgram=id=>sharedClub()&&branches.includes(id)?s.sharedProgram:s.clubPrograms[id];
const activeStampProgram=id=>sharedClub()?`${CLUB_SHARED_ID}-v${s.sharedEpoch}`:id;
const joinedClub=id=>sharedClub()?!!s.sharedJoined:s.joined.includes(id);
const stampCount=id=>sharedClub()?Number(s.sharedStamps||0):Number(s.stamps[id]||0);
const visitKey=id=>sharedClub()?`shared-${id}`:id;
const clubLocationText=()=>sharedClub()?'Válida en Hipódromo y Zona Río':'Exclusiva de la sucursal';
const menuCatalog=id=>s.menuMode==='brand'?s.brandMenu:(s.branchMenus[id]||[]);
const menuAvailable=(item,id)=>item.status==='published'&&(s.menuMode==='brand'?item.locations?.includes(id):true);
const menuAt=id=>menuCatalog(id).filter(item=>menuAvailable(item,id));
const menuMoney=item=>`${item.currency==='USD'?'US$':'MX$'}${Number(item.price||0).toLocaleString('es-MX',{minimumFractionDigits:0,maximumFractionDigits:2})}`;
const menuExtra=item=>[item.origin?`Origen: ${item.origin}`:'',item.varietal?`Variedad: ${item.varietal}`:'',item.process?`Proceso: ${item.process}`:'',item.roast?`Tueste: ${item.roast}`:'',item.notes?`Notas: ${item.notes}`:'',item.beanName?`Grano: ${item.beanName}`:''].filter(Boolean).join(' · ');
const itemMethods=item=>(Array.isArray(item.methods)?item.methods:[]).filter(Boolean);
function menuItemHTML(item,{manage=false,scope=null}={}){
 const cat=MENU_CATEGORIES[item.category]||MENU_CATEGORIES.otro;
 return `<article class="menu-entry"><span class="menu-emoji">${cat[0]}</span><div class="menu-entry-main"><div class="menu-entry-heading"><b>${esc(item.name)}</b><strong class="menu-price">${esc(menuMoney(item))}</strong></div><div class="meta">${esc(cat[1])}${item.status==='draft'?' · Borrador':''}</div><p>${esc(item.description||'')}</p>${menuExtra(item)?`<div class="menu-details">${esc(menuExtra(item))}</div>`:''}${itemMethods(item).length?`<div class="menu-methods">${itemMethods(item).map(x=>t(x,'neutral')).join('')}</div>`:''}${manage?`<div class="menu-entry-actions">${btn('Editar','editMenu:'+item.id,'secondary small')}${btn('Eliminar','deleteMenu:'+item.id,'ghost small')}${s.menuMode==='brand'?`<div class="menu-availability">${branches.map(id=>`<label class="switch-row"><input type="checkbox" data-menu-location="${esc(item.id)}" data-branch="${id}" ${item.locations?.includes(id)?'checked':''}/> ${esc(place(id).area)}</label>`).join('')}</div>`:''}</div>`:''}</div></article>`;
}
function branchMenuPreview(id){const visible=menuAt(id);return `<div class="card menu-preview-branch"><div class="row"><h3>${esc(place(id).area)}</h3>${t(`${visible.length} productos`,'neutral')}</div><div class="menu-methods">${[...new Set(visible.flatMap(itemMethods))].slice(0,6).map(m=>t(m)).join('')}</div><div class="stack" style="gap:4px">${visible.slice(0,3).map(x=>`<div class="menu-mini-row"><span>${esc(x.name)}</span><b>${esc(menuMoney(x))}</b></div>`).join('')}</div><div class="inline-actions" style="margin-top:17px">${btn('Ver menú de esta sede','menuBranch:'+id,'secondary full')}</div></div>`}

function meetupsSection(){return `<section class="card"><div class="row"><div><div class="eyebrow">PLANES ENTRE AMIGOS</div><h3>Encuentros propuestos</h3></div>${t(String(s.meetupDrafts.length),'neutral')}</div><p>Organiza desde una recomendación del feed. Los planes se guardan aquí; compartir es una acción separada y no reserva lugares.</p>${s.meetupDrafts.length?`<div class="stack" style="gap:10px;margin-top:14px">${s.meetupDrafts.map(m=>{const p=place(m.placeId);return `<div class="meetup-draft"><div><b>${esc(p?.branch||'Lugar')}</b><div class="meta">${esc(dateLabel(m.date))} · ${esc(m.time)} · ${esc(m.invited||'Invitación por compartir')}</div>${m.note?`<p>${esc(m.note)}</p>`:''}</div><div class="inline-actions">${btn('Compartir texto','meetupReady:'+m.id,'secondary small')}${btn('Eliminar','meetupDelete:'+m.id,'ghost small')}</div></div>`}).join('')}</div>`:'<div class="empty" style="padding:17px"><p>Desde el feed, pulsa “Proponer encuentro” en una visita de un amigo.</p></div>'}</section>`}
function pageCuenta(){return `${head('TU PERFIL','Tu espacio.','Una identidad para disfrutar Rondaza y, si tienes permisos, gestionar negocios.') }<div class="grid two"><div class="card"><div class="feed-row"><span class="initial green">DG</span><div><h3>Tu perfil</h3><p>Cuenta demostrativa · Español</p></div></div><div class="hr"></div><h3>Funciones personales</h3><div class="stack">${btn('Mis clubes y recompensas →','clubs-personal','secondary full')}${btn('Mis rutas →','nav:rutas','secondary full')}${btn('Mis guardados →','nav:guardados','secondary full')}</div></div><div class="card"><h3>Cambiar de espacio</h3><p>Un mismo perfil puede operar varias sucursales. Las vistas de negocio y administración tienen permisos distintos.</p>${spaceCards()}<p class="slim muted">Los permisos en v19 son simulados: cambiar de espacio no constituye autorización real.</p></div></div>`}

function pageEventsPersonal(){const evs=s.events.filter(e=>e.kind==='public'&&['published','cancelled','postponed'].includes(e.status));return `${head('AGENDA DE CAFÉ','Eventos.','Descubre experiencias y consulta sus detalles. Rondaza no cobra entradas ni procesa pagos; los registros externos se realizan con el organizador.',btn('+ Proponer evento','event-public'))}<div class="toolbar"><button class="tab ${s.cityFilter==='Todos'?'active':''}" data-action="city:Todos">Todas</button><button class="tab ${s.cityFilter==='Tijuana'?'active':''}" data-action="city:Tijuana">Tijuana</button><button class="tab ${s.cityFilter==='San Diego'?'active':''}" data-action="city:San Diego">San Diego</button></div><div class="grid">${evs.filter(x=>s.cityFilter==='Todos'||x.city===s.cityFilter).map(eventCard).join('')||'<div class="empty">No hay eventos con estos filtros.</div>'}</div><div class="section-head"><h2>¿Conoces un encuentro?</h2></div><div class="card"><p>Cualquier persona puede enviar una propuesta. Solo el equipo editorial puede publicarla en la agenda.</p>${btn('Enviar una propuesta →','event-public')}</div>`}

function pageClubBusiness(){const shared=sharedClub();const modeBox=`<section class="card catalog-mode"><div><div class="eyebrow">ALCANCE DEL PROGRAMA</div><h3>¿Dónde puede ganar y usar sellos el cliente?</h3><p>Elige una tarjeta por sede o una sola tarjeta para ambas sucursales autorizadas. Los cambios de modalidad nunca suman saldos de programas diferentes.</p></div><div class="mode-buttons"><button class="mode-card ${!shared?'selected':''}" data-action="loyaltyMode:branch" aria-pressed="${!shared}"><span class="mode-emoji">▦</span><b>Por sucursal</b><small>Saldo y diseño independientes</small></button><button class="mode-card ${shared?'selected':''}" data-action="loyaltyMode:shared" aria-pressed="${shared}"><span class="mode-emoji">◎</span><b>Compartida</b><small>Una tarjeta, dos sedes</small></button></div></section>`;
 if(s.scope==='all')return `${head('BRUMA CAFÉ · LEALTAD','Tarjetas de lealtad.','Configura cómo se usan tus tarjetas en las sucursales autorizadas.')}${modeBox}<div class="banner" style="margin-bottom:18px">${shared?'Los sellos y el límite diario se acumulan entre Hipódromo y Zona Río. Para registrar una visita, selecciona la sede donde ocurrió.':'Cada sucursal mantiene su diseño, sellos y límites independientes. Selecciona una para editar.'}</div><div class="grid ${shared?'shared-overview':'two'} wallet-grid">${(shared?['bruma1']:branches).map(id=>{const pr=effectiveProgram(id);return `<article class="card wallet-item">${stampCard(id)}<h3 style="margin-top:20px">${shared?'Bruma · Tarjeta compartida':esc(place(id).branch)}</h3><p>${shared?'Disponible en las dos sedes':'Programa exclusivo de esta sucursal'}</p>${clubRules(pr)}<div class="inline-actions" style="margin-top:16px">${shared?btn('Diseñar tarjeta compartida','configClub','primary'):btn('Administrar esta sucursal →','setScope:'+id,'secondary full')}</div></article>`}).join('')}</div>${shared?`<div class="section-head"><h2>Registrar compras por sede</h2></div><div class="grid two">${branches.map(id=>`<div class="card"><h3>${esc(place(id).branch)}</h3><p>Los sellos van al mismo programa compartido.</p>${btn('Gestionar visitas →','setScope:'+id,'secondary')}</div>`).join('')}</div>`:''}`;
 const id=s.scope,pr=effectiveProgram(id),a=stampCount(id),log=branchLedger(id),perVisit=Number(pr.perVisit)||1,perDay=Number(pr.perDay)||1;
 return `${head('BRUMA CAFÉ · LEALTAD',`Club · ${esc(place(id).area)}.`,shared?'Compartes el diseño y saldo con la otra sede; las visitas se atribuyen a la sede seleccionada.':'Las reglas y el saldo pertenecen solo a esta sucursal.',btn('✦ Diseñar tarjeta y reglas','configClub','primary'))}${modeBox}<div class="business-loyalty-layout"><div class="card business-preview"><div class="row"><h3>Así se ve la tarjeta del cliente</h3>${t(pr.status==='active'?'Activo':pr.status,pr.status==='active'?'':'amber')}</div>${stampCard(id)}${clubRules(pr)}<p class="slim muted">${clubLocationText()}</p>${btn('Personalizar tarjeta →','configClub','secondary full')}</div><div class="stack"><div class="card"><div class="eyebrow">${shared?'PROGRAMA COMPARTIDO':'PROGRAMA DE SEDE'}</div><h3>${esc(pr.reward)}</h3><p>${esc(pr.description||'Reglas no definidas')}</p><div class="mini-metrics"><div><b>${pr.target}</b><small>sellos / premio</small></div><div><b>${perVisit}</b><small>máx. / visita</small></div><div><b>${perDay}</b><small>máx. / día ${shared?'entre sedes':''}</small></div></div>${btn(pr.status==='active'?'Pausar programa':'Activar programa','toggleClub','ghost small')}</div><div class="card"><div class="row"><h3>Simulador de sellos</h3>${t('Demo local','amber')}</div><p>${shared?'Se registra la sede de la visita. El límite diario se comparte entre ambas; el límite por visita se mide en la sede actual.':'Cada sello se suma únicamente a esta tarjeta.'}</p><div class="stamp-usage"><div><span>Hoy ${shared?'en ambas sedes':''}</span><b>${log.total} / ${perDay}</b></div>${progress(log.total,perDay)}<div><span>Visita actual en ${esc(place(id).area)}</span><b>${log.perVisit} / ${perVisit}</b></div>${progress(log.perVisit,perVisit)}</div><div class="inline-actions">${btn('+ 1 sello','addStamp','primary',pr.status!=='active'||log.total>=perDay||log.perVisit>=perVisit?'disabled':'')}${btn('Nueva visita','newVisit','secondary',pr.status!=='active'||log.total>=perDay?'disabled':'')}${btn('Canjear','redeem','ghost',pr.status!=='active'||a<pr.target?'disabled':'')}</div><p class="slim muted">Sello simulado. No se valida compra ni QR real.</p></div></div></div>`}

function adminReview(){const proposals=s.events.filter(e=>e.kind==='public'&&e.status==='proposed');return `${head('RONDAZA · MODERACIÓN','Propuestas.','Solo el superadministrador decide qué aparece en la agenda general.',btn('Agenda publicada','nav:agenda','secondary'))}<div class="grid four"><div class="card mini-stat"><span class="caption">Pendientes</span><span class="number">${proposals.length}</span></div><div class="card mini-stat"><span class="caption">Publicados</span><span class="number">${s.events.filter(e=>e.kind==='public'&&e.status==='published').length}</span></div><div class="card mini-stat"><span class="caption">Borradores</span><span class="number">${s.events.filter(e=>e.status==='draft').length}</span></div><div class="card mini-stat"><span class="caption">Cancelados</span><span class="number">${s.events.filter(e=>e.status==='cancelled').length}</span></div></div><div class="section-head"><h2>Revisión editorial</h2></div>${proposals.length?`<div class="stack">${proposals.map(e=>`<div class="card"><div class="row"><div><h3>${esc(e.title)}</h3><p>${esc(e.city)} · ${esc(dateLabel(e.date))} · ${esc(e.source)}</p></div>${t('Pendiente','amber')}</div><p>${esc(e.description)}</p><div class="inline-actions">${btn('Publicar en agenda','approve:'+e.id,'primary')}${btn('Rechazar','rejectEvent:'+e.id,'secondary')}${btn('Revisar detalles','eventDetail:'+e.id,'ghost')}</div></div>`).join('')}</div>`:'<div class="empty"><h3>Sin propuestas por revisar</h3><p>Crea una desde Persona o Negocio y vuelve aquí para probar la aprobación.</p></div>'}`}

function adminAudit(){return `${head('TRAZABILIDAD','Auditoría.','La producción necesita registros inmutables por actor, recurso y operación.') }<div class="card"><h3>Contrato de eventos y permisos</h3><div class="timeline"><div class="timepoint"><span class="dot"></span><div><b>Proponer</b><p>Usuario o negocio envía borrador privado</p></div></div><div class="timepoint"><span class="dot"></span><div><b>Revisar y aprobar</b><p>Solo superadmin puede publicar en agenda</p></div></div><div class="timepoint"><span class="dot"></span><div><b>Cambiar o cancelar</b><p>Preservar motivo, historial y visibilidad de estado</p></div></div></div><div class="banner">En esta versión los cambios persisten únicamente en localStorage; no hay auditoría real ni aislamiento entre usuarios.</div></div>`}
function adminConfig(){return `${head('RONDAZA · CONFIG','Configuración editorial.','Reglas centralizadas de publicación y moderación.') }<div class="card"><h3>Reglas vigentes de diseño</h3><p>◉ Propuestas no publicadas nunca aparecen en el calendario público.</p><p>◉ Sólo la superadministración valida, publica, modifica o cancela eventos generales.</p><p>◉ Un negocio puede organizar encuentros privados para invitados sin entrar en agenda.</p><p>◉ El nivel de suscripción no concede permisos editoriales.</p>${btn('Revisar propuestas','nav:revision','secondary')}</div><div class="section-head"><h2>Catálogo, direcciones y trabajo remoto</h2></div><div class="banner">Las fichas tienen contenido ilustrativo. Edita su dirección y las condiciones para trabajar; no son verificadas automáticamente.</div>${locationList(places.map(p=>p.id))}`}
function renderPage(){if(s.space==='personal')return ({inicio:pageInicio,explorar:pageExplorar,guardados:pageGuardados,rutas:pageRutas,cuenta:pageCuenta,'eventos-personal':pageEventsPersonal,'clubs-personal':pageClubsPersonal})[s.page]?.()||pageInicio();if(s.space==='business')return ({posts:businessPosts,eventos:businessEvents,club:pageClubBusiness,designer:pageClubDesigner,menu:pageMenuBusiness,avisos:pageAvisos,mas:pageMas})[s.page]?.()||businessPosts();return ({revision:adminReview,agenda:adminAgenda,auditoria:adminAudit,config:adminConfig})[s.page]?.()||adminReview()}
const THEMES={espresso:{name:'Cacao & cream',bg:'#4a2d27',ink:'#fff8ed'},sage:{name:'Slate atelier',bg:'#405364',ink:'#fff7e7'},clay:{name:'Terracotta',bg:'#9b4f3d',ink:'#fff8ef'},midnight:{name:'Midnight roast',bg:'#1d242b',ink:'#f6eee4'},oat:{name:'Oat milk',bg:'#e7d5bd',ink:'#342c26'}};
const GLYPHS={coffee:'☕',star:'✦',bean:'◉',heart:'♥',croissant:'🥐',flower:'✿'};
function localeDay(){const parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/Tijuana',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const get=t=>parts.find(x=>x.type===t)?.value||'00';return `${get('year')}-${get('month')}-${get('day')}`}
function branchLedger(id){const day=localeDay(),pid=activeStampProgram(id),rows=s.stampEvents.filter(e=>(e.programId||e.branch)===pid&&e.day===day),visit=s.currentVisits[visitKey(id)];return {day,total:rows.reduce((a,e)=>a+e.count,0),visit:visit?.day===day?visit:null,perVisit:visit&&visit.day===day?rows.filter(e=>e.visitId===visit.id&&e.branch===id).reduce((a,e)=>a+e.count,0):0}}
function safeCover(url){return typeof url==='string'&&/^data:image\/(?:jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(url)?url:''}
function stampCard(id,opts={}){const pr=opts.program||effectiveProgram(id),p=place(id),theme=THEMES[pr.cardStyle]||THEMES.espresso,accent=/^#[0-9a-fA-F]{6}$/.test(pr.accent||'')?pr.accent:'#dfbd90',a=opts.preview?Math.min(Number(pr.target)||6,3):joinedClub(id)?stampCount(id):0,target=Math.min(20,Math.max(2,Number(pr.target)||6)),ratio=Math.min(a,target),glyph=GLYPHS[pr.stampGlyph]||GLYPHS.coffee,cover=safeCover(pr.cover),logo=safeCover(pr.logo),shared=sharedClub();return `<div class="loyalty-card ${target>12?'dense':''} theme-${esc(pr.cardStyle||'espresso')}" role="img" aria-label="Tarjeta ${shared?'compartida en dos sedes':'de '+p.branch}: ${a} de ${target} sellos" style="--card-accent:${accent};--card-bg:${theme.bg};--card-ink:${theme.ink};${cover?`--cover-image:url('${cover}');`:''}"><div class="loyalty-gloss"></div><div class="loyalty-orb"></div><div class="loyalty-front"><div class="loyalty-top"><span class="loyalty-brandmark">${logo?`<img src="${logo}" alt=""/>`:esc(p.name.charAt(0).toUpperCase())}</span><div class="loyalty-brand"><span>${esc(pr.cardTitle||p.name)}</span><small>${esc(pr.tagline||'YOUR COFFEE, YOUR RITUAL')}</small></div><span class="loyalty-rondaza">rondaza<span>®</span></span></div><div class="loyalty-mid"><div class="loyalty-label">${shared?'DOS SEDES • UNA SOLA TARJETA':'MEMBERSHIP • '+esc(p.area.toUpperCase())}</div><div class="loyalty-claim">${esc(pr.reward)}</div></div><div class="loyalty-stamps" style="--stamp-columns:${target>12?7:target>8?6:target>6?5:target>4?target:Math.max(target,3)}">${Array.from({length:target},(_,i)=>`<span class="loyalty-stamp ${i<ratio?'earned':''}" title="${i<ratio?'Sello ganado':'Sello pendiente'}" aria-hidden="true">${i<ratio?'✓':esc(glyph)}</span>`).join('')}</div><div class="loyalty-bottom"><span>${opts.preview?'VISTA PREVIA':'MEMBER · DG 0001'}</span><span>${shared?'HIPÓDROMO + ZONA RÍO':'COFFEE CLUB'}</span></div></div></div>`}
function clubRules(pr){return `<div class="club-rule-pills"><span>◉ ${Number(pr.perVisit)||1} ${Number(pr.perVisit)===1?'sello':'sellos'} / visita</span><span>◷ Máx. ${Number(pr.perDay)||1} / día</span><span>✦ ${Number(pr.target)||6} para premio</span></div>`}
function pageClubDesigner(){if(s.scope==='all'&&!sharedClub()){s.page='club';return pageClubBusiness()};const id=s.scope==='all'?'bruma1':s.scope,p=place(id),f=s.form||{...effectiveProgram(id)},shared=sharedClub();return `${head('ESTUDIO DE TARJETAS','Diseña tu club.',shared?'Configuración compartida: los cambios se verán en ambas sucursales autorizadas.':`Tarjeta propia para ${esc(p.branch)}.`,btn('← Volver al club','cancelClubDesigner','secondary'))}<div class="designer-layout"><div class="designer-preview"><p class="eyebrow">ASÍ LA VERÁ TU CLIENTE</p><div id="club-card-preview">${stampCard(id,{program:f,preview:true})}</div><div id="rules-live">${clubRules(f)}</div><div class="designer-hint">Los sellos visibles en la tarjeta muestran el progreso. La vista previa usa 3 sellos de ejemplo.</div><div class="designer-note"><b>Alcance: ${shared?'ambas sedes':'una sucursal'}</b><p>Los límites diarios del programa compartido aplican al total de visitas entre sedes. En producción: reglas versionadas y control de permisos.</p></div></div><div class="designer-settings"><section class="card studio-section"><div class="row"><h3>01 · Identidad visual</h3>${t(shared?'Marca compartida':'Sucursal','neutral')}</div><p>Personaliza la tarjeta con identidad propia de tu cafetería.</p>${field('cardTitle','Nombre visible en tarjeta','text',f.cardTitle||p.name,true,'maxlength="35"')}${field('tagline','Frase de la marca','text',f.tagline||'YOUR COFFEE CLUB',false,'maxlength="40"')}<div class="field-group"><label>Paleta base</label><div class="theme-swatches">${Object.entries(THEMES).map(([key,th])=>`<button type="button" class="theme-swatch ${f.cardStyle===key?'selected':''}" data-action="theme:${key}" title="${esc(th.name)}" aria-label="${esc(th.name)}" aria-pressed="${f.cardStyle===key}"><span style="background:${th.bg}"></span><small>${esc(th.name)}</small></button>`).join('')}</div></div><div class="designer-field-row"><div class="field-group"><label for="f-accent">Color de sellos</l function refreshClubDesigner(){if(s.space!=='business'||s.page!=='designer'||!s.form)return;const prev=document.getElementById('club-card-preview'),rules=document.getElementById('rules-live');if(prev)prev.innerHTML=stampCard(s.scope==='all'?'bruma1':s.scope,{program:s.form,preview:true});if(rules)rules.innerHTML=clubRules(s.form);document.querySelectorAll('.theme-swatch').forEach(el=>{let yes=el.dataset.action==='theme:'+s.form.cardStyle;el.classList.toggle('selected',yes);el.setAttribute('aria-pressed',String(yes))})}
async function handleImageUpload(input){const f=input.files?.[0],name=input.dataset.upload;if(!f||!['cover','logo'].includes(name))return;if(f.size>5*1024*1024||!['image/jpeg','image/png','image/webp'].includes(f.type))return notice('Sube un PNG, JPEG o WebP de hasta 5 MB');try{const url=URL.createObjectURL(f);const img=new Image();await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});const max=name==='logo'?320:1200,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);s.form[name]=canvas.toDataURL(name==='logo'?'image/png':'image/jpeg',.79);URL.revokeObjectURL(url);refreshClubDesigner();notice('Imagen lista para vista previa. Guarda para aplicarla.')}catch(e){notice('No se pudo procesar la imagen')}}

 if(act==='toggleClub'){if(s.scope==='all')return notice('Selecciona una sucursal');const pr=effectiveProgram(s.scope);pr.status=pr.status==='active'?'paused':'active';persist();notice('Estado del programa: '+pr.status);return}
 if(act==='addStamp'){if(s.scope==='all')return notice('Selecciona la sede de la compra');const id=s.scope,pr=effectiveProgram(id),limitV=Number(pr.perVisit)||1,limitD=Number(pr.perDay)||1;if(!joinedClub(id))return notice('El cliente de ejemplo no está inscrito');if(pr.status!=='active')return notice('Este programa está pausado');let log=branchLedger(id);if(log.total>=limitD)return notice('Límite diario del programa alcanzado: '+limitD);if(log.visit&&log.perVisit>=limitV)return notice('Límite por visita alcanzado: '+limitV);if(!log.visit){s.currentVisits[visitKey(id)]={id:'visit-'+Date.now()+'-'+id,day:log.day};log=branchLedger(id)}s.stampEvents.push({id:'stamp-'+Date.now()+'-'+s.stampEvents.length,programId:activeStampProgram(id),branch:id,day:log.day,visitId:s.currentVisits[visitKey(id)].id,count:1});if(sharedClub())s.sharedStamps=(s.sharedStamps||0)+1;else s.stamps[id]=(s.stamps[id]||0)+1;persist();notice('Sello de '+place(id).area+' registrado. '+branchLedger(id).total+'/'+limitD+' hoy en el programa.');return}
 if(act==='redeem'){const id=s.scope,pr=effectiveProgram(id);if(!branches.includes(id))return notice('Selecciona una sucursal');if(pr.status!=='active'||stampCount(id)<pr.target)return notice('Recompensa no disponible');if(sharedClub())s.sharedStamps-=pr.target;else s.stamps[id]-=pr.target;const key=activeStampProgram(id);s.redeemed[key]=(s.redeemed[key]||0)+1;persist();notice('Canje de demostración en '+place(id).area+' registrado');return}
if(act.startsWith('qr:')||act.startsWith('consent:')){s.modal=act;render();return}
 if(act.startsWith('join:')){const id=act.slice(5),pr=effectiveProgram(id==='shared'?'bruma1':id);if(!pr||pr.status!=='active')return notice('Este programa no acepta inscripciones');s.form={id,marketing:false};s.modal='join';render();return}
 if(act==='confirmJoin'){const id=s.form.id;if(id==='shared'){s.sharedJoined=true}else{if(!s.joined.includes(id))s.joined.push(id);s.marketingConsent[id]=Boolean(s.form.marketing)}s.modal=null;persist();notice('Inscripción simulada guardada; la publicidad es opcional.');return}
if(act==='campaignPreview'){s.modal='campaignPreview';render();return}
if(act==='resetDemo'){if(window.confirm('¿Reiniciar los datos de demostración de v21.2 en este navegador?')){localStorage.removeItem(STORE);window.location.reload()}return}
}
function showEventKind(){s.modal='chooseKind';render()}
const oldModal=modal;modal=function(){if(s.modal==='chooseKind')return `<div class="modal-overlay" data-action="overlay-close"><section class="modal" role="dialog" aria-modal="true" aria-label="Tipo de evento"><div class="modal-header"><h2>¿Qué tipo de evento quieres crear?</h2><button class="x" data-action="close" aria-label="Cerrar">×</button></div><p class="lead" style="margin-bottom:20px">La audiencia y los permisos cambian según el tipo de evento.</p><div class="stack"><button class="radio-choice" data-action="choose-private"><span style="font-size:26px">🔒</span><span><b>Encuentro privado de mi cafetería</b><br/><small class="muted">Invitados y RSVP, fuera de la agenda pública</small></span></button><button class="radio-choice" data-action="choose-public"><span style="font-size:26px">🗓️</span><span><b>Proponer a la agenda de Rondaza</b><br/><small class="muted">Se envía a revisión editorial; no se publica automáticamente</small></span></button></div></section></div>`;return oldModal()};
const app=document.getElementById('app');
app.addEventListener('click',e=>{const elem=e.target.closest('[data-action]');if(!elem)return;const act=elem.dataset.action;if(act==='overlay-close'&&e.target!==elem)return;e.preventDefault();handleAction(act)});
app.addEventListener('change',e=>{const el=e.target;if(el.dataset.menuLocation){const entry=s.brandMenu.find(x=>x.id===el.dataset.menuLocation),branch=el.dataset.branch;if(entry&&branches.includes(branch)){entry.locations=el.checked?[...new Set([...(entry.locations||[]),branch])].sort():(entry.locations||[]).filter(x=>x!==branch);persist();notice('Disponibilidad actualizada para '+place(branch).area)}return}if(el.dataset.change==='scope'){s.scope=el.value;persist();render()}else if(el.dataset.change==='mapTravelMode'){s.mapTravelMode=el.value==='walking'?'walking':'driving';persist();render()}else if(el.dataset.change?.startsWith('consent:')){const id=el.dataset.change.slice(8);s.marketingConsent[id]=Boolean(el.checked);persist();notice('Preferencia guardada en este navegador')}else if(el.dataset.change==='joinMarketing'){ensureForm();s.form.marketing=Boolean(el.checked)}else if(el.dataset.form){ensureForm();s.form[el.dataset.form]=el.value;refreshClubDesigner()}else if(el.dataset.upload){handleImageUpload(el)}});
app.addEventListener('input',e=>{const el=e.target;if(el.dataset.form){ensureForm();s.form[el.dataset.form]=el.value;refreshClubDesigner()}else if(el.dataset.input==='placeSearch'){s.placeSearch=el.value;let focus=el.selectionStart;render();let newel=app.querySelector('[data-input="placeSearch"]');newel?.focus();newel?.setSelectionRange(focus,focus)}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&s.modal){s.modal=null;render()}});
render();
})();


</script>
